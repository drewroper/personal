<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>log — drewroper</title>
  <link rel="icon" type="image/svg+xml" href="assets/dr-logo.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:         #0c0c0d;
      --text:       #f4f1ec;
      --text-muted: #8c8a86;
      --text-faint: #56544f;
      --accent:     #d6ff38;
      --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { background: var(--bg); }
    body {
      background: var(--bg);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    ::selection { background: var(--accent); color: var(--bg); }

    .log {
      /* 20px on top, left, right; generous padding-bottom so the end
         of the feed has breathing room once you scroll to it. */
      padding: 20px 20px 80px;
      overflow-wrap: break-word;
      hyphens: auto;
    }

    .meta {
      color: var(--text-faint);
      margin-bottom: 18px;
    }
    .meta a {
      color: var(--text-faint);
      text-decoration: none;
      border-bottom: 1px solid var(--text-faint);
    }
    .meta a:hover { color: var(--accent); border-bottom-color: var(--accent); }
    .meta__icon {
      display: inline-block;
      width: 1em;
      height: 1em;
      vertical-align: -2px;
      color: var(--accent);
    }
    .meta__icon svg { width: 100%; height: 100%; }

    /* Clickable source filters in the legend row — each one toggles
       a filter that dims every non-matching entry below. */
    .meta__filter {
      font: inherit;
      color: var(--text-faint);
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color .15s ease, opacity .15s ease;
    }
    .meta__filter:hover { color: var(--text-muted); }
    /* When ANY filter is active, dim the un-active legend buttons. */
    .log.is-filtered .meta__filter             { opacity: .35; }
    .log.is-filtered .meta__filter.is-active   { opacity: 1; color: var(--text); }
    .meta__filter.is-active .meta__icon        { color: var(--accent); }

    /* Year pills are inserted inline into the stream of entries —
       they mark the moment a new year begins without breaking the
       chain. inline-block keeps the pill compact (only as wide as
       the year text); a non-breaking space in JS binds pill + next
       entry so they wrap as a unit. */
    .year__pill {
      display: inline-block;
      padding: 1px 9px;
      background: var(--accent);
      color: var(--bg);
      font-weight: 500;
      border-radius: 999px;
      letter-spacing: .02em;
      vertical-align: 1px;
      white-space: nowrap;
    }

    /* Each entry is inline; the wall of text flows naturally. */
    .entry a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color .15s ease, border-color .15s ease;
    }
    .entry a:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* Filter state — when a source is selected, every entry that
       isn't that source fades back. The chain stays unbroken
       (separators + year pills are untouched) but only the chosen
       source pops. */
    .log.is-filtered .entry          { opacity: .18; transition: opacity .2s ease; }
    .log.is-filtered .entry.is-match { opacity: 1; }
    .entry__tag    { color: var(--text-faint); }
    .entry__icon   {
      color: var(--accent);
      width: 1em;
      height: 1em;
      vertical-align: -2px;
      flex: none;
    }
    .entry__year   { color: var(--text-faint); }
    .entry__venue  { color: var(--text-muted); }
    .entry__rating { color: var(--text); }
    .entry__date   { color: var(--text-faint); }
    .sep           { color: var(--text-faint); }

    .empty { color: var(--text-faint); }
  </style>
</head>
<body>
  <main class="log" id="js-log">
    <div class="meta">
      <a href="/">← drewroper.com</a>
      &nbsp;·&nbsp; <span id="js-count">…</span> entries
      &nbsp;·&nbsp; <button type="button" class="meta__filter" data-source="letterboxd"><span class="meta__icon" data-icon="film-reel" aria-hidden="true"></span> letterboxd</button>
      &nbsp;·&nbsp; <button type="button" class="meta__filter" data-source="discogs"><span class="meta__icon" data-icon="vinyl-record" aria-hidden="true"></span> discogs</button>
      &nbsp;·&nbsp; <button type="button" class="meta__filter" data-source="songkick"><span class="meta__icon" data-icon="microphone-stage" aria-hidden="true"></span> songkick</button>
    </div>
    <div id="js-feed" class="empty">Loading…</div>
  </main>

  <script src="log.js?v=3"></script>
</body>
</html>
