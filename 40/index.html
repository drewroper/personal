<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>40 albums · 40 days — drewroper</title>
  <meta name="description" content="Forty albums that shaped me, one a day, before I turn forty." />
  <meta name="theme-color" content="#0c0c0d" />
  <link rel="icon" type="image/svg+xml" href="../assets/dr-logo.svg" />
  <meta property="og:title" content="40 albums · 40 days" />
  <meta property="og:description" content="Forty albums that shaped me, one a day, before I turn forty." />
  <meta property="og:url" content="https://drewroper.com/40" />
  <meta property="og:image" content="https://drewroper.com/assets/og-image.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* Same type system as the homepage: Geist for reading, Geist Mono at
       11px for labels and metadata. The About H1 is Porca, self-hosted. */
    @font-face {
      font-family: 'Porca'; font-weight: 400; font-display: swap;
      src: url('../assets/fonts/Porca.otf') format('opentype');
    }
    :root {
      --bg:         #0c0c0d;
      --bg-raised:  #131315;
      --rule:       #262628;
      --text:       #f4f1ec;
      --text-muted: #8c8a86;
      --text-faint: #56544f;
      --accent:     #d6ff38;
      --font-display: 'Porca', 'Geist Mono', ui-monospace, monospace;
      --font-sans:    'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --font-mono:    'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      --mono-size: 11px;
      --display-size: clamp(56px, 17vw, 140px);   /* About lines and album names share this */
      --gutter: 20px;                             /* page edge, scales up on desktop */
      --page-max: 640px;
      --vw: 100vw;                                /* set by JS to the real client width (no scrollbar) */
      --measure: 60ch;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    :root { --sab: env(safe-area-inset-bottom, 0px); }
    html { background: var(--bg); scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    ::selection { background: var(--accent); color: var(--bg); }
    a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--text-faint); }
    a:hover { color: var(--accent); border-bottom-color: var(--accent); }

    /* Label voice — every small-caps mono string on the page. */
    .mono {
      font-family: var(--font-mono); font-size: var(--mono-size);
      letter-spacing: .08em; text-transform: uppercase;
    }

    /* Mobile-first. One column, phone width; the desktop gets a little
       more room but the same structure. */
    .page { max-width: var(--page-max); margin: 0 auto; padding: 0 var(--gutter) 0; }

    /* ── Top bar, same recipe as the homepage: brand mark left, title
       centered, one control right; mono, translucent, hairline. The About
       panel hangs off it as a dropdown, so it opens wherever you are. ── */
    .bar { position: sticky; top: 0; z-index: 50; margin: 0 calc(-1 * var(--gutter)); }
    .bar__row {
      position: relative; z-index: 1;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: .75rem;
      min-height: 48px; padding: .6rem var(--gutter) .55rem;
      letter-spacing: .04em;
      background: rgba(12,12,13,.78);
      backdrop-filter: saturate(140%) blur(10px);
      -webkit-backdrop-filter: saturate(140%) blur(10px);
      border-bottom: 1px solid var(--rule);
    }
    .bar__brand { justify-self: start; color: var(--text-muted); border: 0; display: inline-flex; }
    .bar__brand:hover { color: var(--accent); }
    .brand-mark { height: 1em; width: auto; display: inline-block; vertical-align: -0.12em; font-size: 14px; }
    .bar__name { justify-self: center; margin: 0; white-space: nowrap;
                 font-family: var(--font-display); font-size: 22px; line-height: 1; letter-spacing: -.06em; color: var(--text);
                 opacity: 0; transform: translateY(14px); pointer-events: none;
                 transition: opacity .35s ease, transform .45s cubic-bezier(.2,.7,.2,1); }
    .bar.is-scrolled .bar__name { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .bar__name { transition: none; } }
    /* The wordmark: 404040 edge to edge, top of the page and bottom. Porca's
       ink sits .214em below a 1em line box's top and .237em above its bottom,
       so the box is clipped to the ink height and the glyphs shifted up —
       then gutters are measured from the ink, not the box. */
    .wordmark {
      font-family: var(--font-display); font-size: calc((min(var(--vw), var(--page-max)) - 2 * var(--gutter)) / 2.368); line-height: 1;
      letter-spacing: -.06em; color: var(--text); white-space: nowrap;
      height: calc(1em - .214em - .237em); overflow: hidden;
      margin: 0 0 0 -.02em; user-select: none;
    }
    .wordmark > span { display: block; margin-top: -.214em; }
    .wordmark--top  { margin-top: 24px; margin-bottom: 20px; }
    .bar__about {
      justify-self: end;
      font: inherit; letter-spacing: inherit; text-transform: inherit;
      color: var(--text-muted);
      background: none; border: 1px solid var(--rule); border-radius: 999px;
      padding: 4px 11px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color .15s ease, border-color .15s ease;
    }
    @media (hover: hover) { .bar__about:hover { color: var(--text); border-color: var(--text-faint); } }
    .bar__about[aria-expanded="true"], .bar__about[aria-expanded="true"]:hover { color: var(--accent); border-color: var(--accent); }

    /* ── About: a full-screen type poster under the bar. Closed on load.
       Every line is the H1 size; lines are hand-broken so none wraps. ── */
    .about {
      position: fixed; inset: 0; z-index: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
      background: rgba(12,12,13,.82); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%);
      padding: 64px var(--gutter) calc(20px + var(--sab));
      display: flex; flex-direction: column; box-sizing: border-box;
      font-family: var(--font-sans); text-transform: none; letter-spacing: 0;
    }
    .about[hidden] { display: none; }
    .about > * { flex: none; }
    .about__title {
      margin: 0; padding: 0; max-width: 760px;
      font-family: var(--font-display); font-weight: 400; color: var(--text);
      font-size: min(var(--display-size), 10vh, 10dvh); line-height: .8; letter-spacing: 0;
    }
    .about__title > * { display: block; white-space: nowrap; margin-left: -.03em; }
    /* Same stack as an entry: Porca title, mono facts line, Geist blurb. */
    .about__body  { max-width: var(--measure); margin: 20px 0 0; color: var(--text); font-size: 16px; line-height: 1.55; font-weight: 300; }
    /* One line: the disclaimer on the left, the dates on the right. */
    .about__meta  { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; flex-wrap: wrap; max-width: 560px; margin: 12px 0 0; }
    .about__quiet { margin: 0; color: var(--text-faint); font-size: 14px; line-height: 1.5; font-weight: 300; }
    .about__facts { margin: 0; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; font-family: var(--font-mono); font-size: var(--mono-size); white-space: nowrap; }
    .about .grid40 { margin-top: 24px; }
    @media (max-height: 620px) {
      .about { padding-top: 58px; }
      .about__title { font-size: min(var(--display-size), 8.6vh); }
      .about__body { font-size: 15px; margin-top: 14px; }
      .about__meta { margin-top: 8px; }
      .about .grid40 { margin-top: 16px; }
    }
    .about__title em { font-style: normal; color: var(--accent); }
    .about__title .is-quiet { color: var(--text-faint); }
    .about__title .is-date { color: var(--accent); }
    .about__title .is-gap { height: .5em; }
    @media (prefers-reduced-motion: no-preference) {
      .about:not([hidden]) .about__title > *, .about:not([hidden]) .about__meta, .about:not([hidden]) .about__body, .about:not([hidden]) .grid40 { animation: rise .42s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 60ms); }
      @keyframes rise { from { opacity: 0; transform: translateY(.35em); } to { opacity: 1; transform: none; } }
    }

    /* ── Entries: newest first, cover is the hero at phone width. ────── */
    .entry { padding: 24px 0 40px; border-bottom: 1px solid var(--rule); scroll-margin-top: 56px; }
    .entry__head { display: flex; justify-content: space-between; align-items: baseline; color: var(--text-faint); }
    .entry__no { color: var(--accent); }
    .entry__no a { color: inherit; border: 0; }
    .entry__no a:hover { color: var(--text); }

    .entry__cover {
      display: block; width: 100%; aspect-ratio: 1; object-fit: cover; margin-top: 16px;
      background: var(--bg-raised); border: 1px solid var(--rule); border-radius: 2px;
    }
    .entry__cover-wrap { position: relative; margin-top: 16px; cursor: pointer; -webkit-tap-highlight-color: transparent; perspective: 1400px; }
    .entry__cover-wrap .entry__cover { margin-top: 0; }
    /* Tap the cover and it flips over to the back of the record. */
    .flip { position: relative; aspect-ratio: 1; transform-style: preserve-3d; transition: transform .75s cubic-bezier(.2, .75, .15, 1); }
    .is-flipped .flip { transform: rotateY(180deg); }
    .flip__front, .flip__back { -webkit-backface-visibility: hidden; backface-visibility: hidden; }
    .flip__back {
      position: absolute; inset: 0; transform: rotateY(180deg);
      background: var(--bg-raised); border: 1px solid var(--rule); border-radius: 2px; overflow: hidden;
      display: grid; place-items: center;
    }
    .flip__back img { display: block; width: 100%; height: 100%; object-fit: contain; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
    .flip__back img.is-square { object-fit: cover; }
    /* ?worn — each record's own sleeve wear laid over its cover (and, turned, its back). */
    .flip__wear { display: none; }
    .is-worn .flip__wear { display: block; position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 2px; pointer-events: none; opacity: var(--wear, .7); -webkit-backface-visibility: hidden; backface-visibility: hidden; }
    .is-worn .flip__back .flip__wear { transform: rotate(180deg); }
    /* Paper stock: one shared tile at a fixed physical scale, so every sleeve reads as printed card. */
    .flip__paper { display: none; }
    .is-worn .flip__paper { display: block; position: absolute; inset: 0; border-radius: 2px; pointer-events: none; background: url(../assets/40/wear/paper.webp) 0 0 / 256px 256px repeat; opacity: var(--paper, .7); -webkit-backface-visibility: hidden; backface-visibility: hidden; }
    .flip__list { margin: 0; padding: 18px 20px; width: 100%; height: 100%; box-sizing: border-box; list-style: none; display: flex; flex-direction: column; justify-content: center; font-size: 11px; line-height: 1.5; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); }
    .flip__list li { display: flex; gap: 10px; }
    .flip__list li span:first-child { color: var(--text-faint); flex: none; width: 2em; }
    .flip__list li span:last-child { color: var(--text-faint); margin-left: auto; padding-left: 8px; }
    .flip__list.is-long { font-size: 9.5px; padding: 14px 16px; }
    .flip__list.is-xlong { font-size: 8px; line-height: 1.4; }
    .flip__list-foot { margin-top: 10px; color: var(--text-faint); font-size: 8.5px; }
    @media (prefers-reduced-motion: reduce) { .flip { transition: none; } }
    .entry__artist { margin: 20px 0 0; color: var(--text-muted); font-size: 15px; }
    .entry__title  {
      margin: 8px 0 0 -3px; color: var(--text);
      font-family: var(--font-display); font-weight: 400;
      font-size: var(--display-size); line-height: .92; letter-spacing: 0;
    }
    .entry__facts  { margin: 12px 0 0; color: var(--text-faint); }
    .entry__facts span + span::before { content: ' · '; }
    .entry__found  { margin: 14px 0 0; color: var(--text-muted); font-size: 14px; }
    .entry__found b { font-weight: 400; color: var(--text-faint); margin-right: .4em; }

    .entry__blurb { max-width: var(--measure); margin: 24px 0 0; color: var(--text); font-size: 17px; line-height: 1.6; font-weight: 300; }
    .entry__blurb p { margin: 0 0 1.1em; }
    .entry__blurb p:last-child { margin-bottom: 0; }
    .entry__blurb em { font-style: italic; }
    .entry__blurb--empty { color: var(--text-faint); }

    .entry__player { margin: 26px 0 0; }
    .entry__player iframe { width: 100%; height: 450px; border: 0; overflow: hidden; background: transparent; border-radius: 10px; }
    .entry__noplayer { color: var(--text-faint); font-size: 14px; }

    /* Listen elsewhere: one button that resolves the album on any service
       (album.link), then direct pills. On a phone each pill opens the app. */
    /* Selectors are deliberately heavier than the page's global a:hover,
       which would otherwise repaint these on hover / stuck iOS hover. */
    .listen { margin: 22px 0 0; display: flex; gap: 8px; }
    .listen.listen--solo a, .listen.listen--solo a:only-child { flex: 1 1 100%; max-width: none; }
    .listen a {
      flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 14px; border-radius: 999px; white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: color .15s ease, background .15s ease, border-color .15s ease;
    }
    .listen a.listen__any, .listen a.listen__any:hover { color: var(--accent); background: none; border: 1px solid var(--accent); }
    .listen a.listen__svc, .listen a.listen__svc:hover { color: var(--text-muted); background: none; border: 1px solid var(--rule); }
    @media (hover: hover) {
      .listen a.listen__any:hover { color: var(--bg); background: var(--accent); }
      .listen a.listen__svc:hover { color: var(--text); border-color: var(--text-faint); }
    }
    .listen a.listen__any:active { color: var(--bg); background: var(--accent); }
    .listen a.listen__svc:active { color: var(--text); border-color: var(--text-faint); }

    details { margin: 18px 0 0; }
    summary { cursor: pointer; color: var(--text-faint); list-style: none; user-select: none; }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: '▸ '; }
    details[open] summary::before { content: '▾ '; }
    summary:hover { color: var(--text); }
    .tracks { margin: 12px 0 0; padding: 0; list-style: none; font-size: 14px; }
    .tracks li { display: flex; align-items: baseline; gap: 12px; padding: 3px 0; }
    .tracks__n { color: var(--text-faint); flex: none; width: 2.2em; text-align: right; }
    .tracks__t { color: var(--text-muted); flex: 1; }
    .tracks__d { color: var(--text-faint); flex: none; }

    .empty { padding: 48px 0; color: var(--text-faint); font-size: 17px; font-weight: 300; border-bottom: 1px solid var(--rule); }
    .empty b { color: var(--text); font-weight: 400; }

    /* ── Footer: a real one, with room to grow. ─────────────────────── */
    .foot { padding: 36px 0 0; color: var(--text-faint); }
    .foot__links { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0; padding: 0; list-style: none; }
    .foot__links a { color: var(--text-muted); border-bottom-color: transparent; }
    .foot__links a:hover { color: var(--accent); border-bottom-color: var(--accent); }
    /* ── Birthday mode: Nov 1, or ?birthday to preview. ───────────────── */
    .confetti { position: fixed; inset: 0; z-index: 30; pointer-events: none; image-rendering: pixelated; }
    .is-birthday .wordmark { cursor: pointer; user-select: none; }
    .is-birthday .wordmark.is-playing > span { animation: hop .28s steps(2, jump-none) infinite; }
    @keyframes hop { 50% { transform: translateY(-.04em); } }
    .grid40 a.is-arriving { position: relative; }
    .grid40 a.is-arriving canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }

    /* The 40 cells from the closing card, filling in as records post. */
    .grid40 { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin: 0; max-width: 560px; }
    /* Past the footer wordmark the 404040 repeats, each copy more eroded by dither, until nothing is left. */
    /* ── The tail: scroll pulls a pixel extrusion out of 404040 and you travel down it. ── */
    .tail { position: relative; }
    .tail__stage { position: sticky; top: 0; height: 100vh; height: 100dvh; overflow: hidden; }
    .tail__cv { position: absolute; inset: 0; display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
    .tail__col { position: relative; height: 100%; }
    .tail__cap { position: absolute; top: 0; left: var(--gutter); will-change: transform; visibility: hidden; }
    /* The bonus album: surfaces inside the chaos about twenty swipes in, laid out like any entry,
       on a translucent panel so the tunnel keeps moving around and through it. */
    .tail { height: auto; min-height: 160vh; min-height: 160dvh; }
    .tail__bonus { position: relative; z-index: 2; margin-top: 100vh; margin-top: 100dvh; padding-bottom: 40px; opacity: 0; transition: opacity .6s ease; }
    .tail__bonus[hidden] { display: none; }
    .tail__bonus.is-in { opacity: 1; }
    .tail__bonus .entry { border: 1px solid var(--rule); border-radius: 14px; padding: 24px 20px 32px; background: rgba(12,12,13,.78); backdrop-filter: blur(10px) saturate(120%); -webkit-backdrop-filter: blur(10px) saturate(120%); }
    .tail__bonus .entry__head { color: var(--text-faint); }
    .tail__bonus .entry__title { font-size: min(var(--display-size), 11vw); overflow-wrap: anywhere; }
    .entry__cover--empty { display: grid; place-items: center; font-family: var(--font-display); font-size: clamp(64px, 20vw, 120px); color: var(--text-faint); letter-spacing: -.04em; }
    @media (min-width: 1024px) { .tail__bonus .entry { padding: 48px 40px 56px; } }
    @media (prefers-reduced-motion: reduce) { .tail { height: 100vh; height: 100dvh; } }
    .grid40 > * { display: block; aspect-ratio: 1; border-radius: 2px; overflow: hidden; }
    .grid40 span { border: 1px solid var(--rule); display: grid; place-items: center; font: 400 9px/1 var(--font-mono); letter-spacing: .06em; color: var(--text-faint); opacity: .8; user-select: none; }
    .grid40 span.is-today { border-color: var(--accent); color: var(--accent); }
    .grid40 a { border: 0; }
    .grid40 a img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .grid40 a:hover img { opacity: .8; }

    /* Desktop gets the cover beside the title; everything else stays. */
    @media (min-width: 720px) {
      :root { --page-max: 760px; }
      .entry__grid { display: grid; grid-template-columns: 220px 1fr; gap: 28px; align-items: start; }
      .entry__cover { margin-top: 0; }
      .entry__artist { margin-top: 0; }
      .entry__grid { margin-top: 20px; }
      .listen a { flex: 0 1 auto; }
      .tracks { columns: 2; column-gap: 32px; }
      .tracks li { break-inside: avoid; }
    }

    /* ── Desktop: the wordmark goes wall to wall, entries become two columns with the
       cover as a large sticky object, About becomes a spread with the grid on the right. ── */
    @media (min-width: 1024px) {
      :root { --gutter: 40px; --page-max: 1440px; --display-size: clamp(64px, 6.4vw, 112px); }
      .wordmark--top { margin: 40px 0 24px; }
      .entry {
        display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); column-gap: 72px;
        grid-template-areas: "cover head" "cover text" "cover blurb" "cover player" "cover listen" "cover tracks";
        padding: 56px 0 88px; scroll-margin-top: 48px;
      }
      .entry__head { grid-area: head; align-self: start; }
      .entry__grid { display: contents; }
      .entry .entry__cover-wrap { grid-area: cover; position: sticky; top: 72px; align-self: start; margin: 0; }
      .entry__text { grid-area: text; }
      .entry__artist { margin-top: 32px; font-size: 17px; }
      .entry__title { margin-top: 8px; }
      .entry__blurb { grid-area: blurb; max-width: 62ch; font-size: 18px; }
      .entry__player { grid-area: player; max-width: 660px; }
      .entry .listen { grid-area: listen; max-width: 660px; }
      .entry details { grid-area: tracks; }
      .about {
        display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); column-gap: 72px;
        align-content: center; align-items: start; padding-top: 48px;
        max-width: var(--page-max); box-sizing: border-box; margin: 0 auto;
      }
      .about[hidden] { display: none; }
      .about__title { grid-column: 1; font-size: min(var(--display-size), 11vh); }
      .about__body { grid-column: 1; font-size: 18px; max-width: 52ch; }
      .about__meta { grid-column: 1; max-width: 52ch; }
      .about .grid40 { grid-column: 2; grid-row: 1 / span 3; align-self: center; margin: 0; max-width: 560px; justify-self: end; width: 100%; }
      .grid40 span { font-size: 11px; }
      .foot { padding-top: 48px; }
    }

  </style>
</head>
<body>
  <main class="page">
    <header class="bar mono" aria-label="Site meta">
      <div class="bar__row">
      <a class="bar__brand" href="/" aria-label="Drew Roper — home">
        <svg class="brand-mark" viewBox="0 0 71 58" aria-hidden="true" focusable="false">
          <path fill="currentColor" fill-rule="evenodd" d="M40.508 0H0v8.395h40.508c12.207 0 21.77 9.05 21.77 20.603 0 10.936-8.564 19.63-19.877 20.53l-6.288-7.554h4.116l.114.001c7.132 0 12.935-5.821 12.935-12.976 0-7.154-5.803-12.972-12.935-12.972H0v8.395h9.284v25.184H0V58h25.53v-8.395h-7.736v-7.631h7.307l12.064 14.492L38.496 58h2.012c16.979 0 30.28-12.739 30.28-29.002C70.788 12.737 57.487 0 40.508 0Zm-22.714 24.421h22.55c2.397 0 4.424 2.096 4.424 4.577 0 2.483-2.027 4.581-4.424 4.581h-.115H17.794v-9.158Z"/>
        </svg>
      </a>
      <span class="bar__name" aria-label="40 albums, 40 days, 40 years">404040</span>
      <button class="bar__about" id="js-about-btn" type="button" aria-expanded="false" aria-controls="js-about">About</button>
      </div>
      <section class="about" id="js-about" hidden>
        <h1 class="about__title">
          <span style="--i:0">40 albums,</span>
          <em style="--i:1">40 days,</em>
          <span style="--i:2">40 years.</span>
        </h1>
        <p class="about__body" style="--i:3">Counting down forty albums that shaped me, one a day, before I turn forty.</p>
        <div class="about__meta" style="--i:4">
          <p class="about__quiet">In no particular order.</p>
          <p class="about__facts mono">Sep 23 → Nov 1, 2026</p>
        </div>
        <nav class="grid40" id="js-grid" aria-label="Every day of the countdown" style="--i:5"></nav>
      </section>
    </header>

    <div class="wordmark wordmark--top" aria-hidden="true"><span>404040</span></div>

    <section id="js-feed" class="empty">Loading…</section>

    <footer class="foot mono">
      <ul class="foot__links">
        <li><a href="/">← drewroper.com</a></li>
        <li><a href="https://claude.com/claude-code" target="_blank" rel="noopener">Made with Claude Code ↗</a></li>
      </ul>
    </footer>
  </main>
  <section class="tail" id="js-tail" aria-hidden="true">
    <div class="tail__stage">
      <canvas class="tail__cv" id="js-tail-cv"></canvas>
      <div class="page tail__col">
        <div class="wordmark tail__cap" id="js-tail-start"><span>404040</span></div>
      </div>
    </div>
    <div class="page tail__bonus" id="js-tail-bonus" hidden></div>
  </section>

  <script>
  (() => {
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    // "Today" in Denver — the countdown runs on the day the story posts,
    // not on wherever the reader's browser happens to be.
    const today = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'America/Denver', year: 'numeric', month: '2-digit', day: '2-digit',
    }).format(new Date());

    // ?preview shows every slotted record regardless of date, so a blurb
    // can be proofed before it goes live. ?test (also /40/test/) swaps in
    // data/albums.test.json — sample entries for looking at the design.
    const params  = new URLSearchParams(location.search);
    const test    = params.has('test');
    const preview = test || params.has('preview');
    const WORN    = !params.has('clean');   // worn sleeves are the default; ?clean shows the original art
    const DATA    = test ? '../data/albums.test.json' : '../data/albums.json';

    const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    // Blurbs are plain paragraphs; _underscores_ become italics for titles.
    const inline = s => esc(s).replace(/_([^_]+)_/g, '<em>$1</em>');
    const pad = n => String(n).padStart(2, '0');
    const fmtDate = iso => {
      const [y, m, d] = iso.split('-').map(Number);
      return `${MONTHS[m - 1]} ${d}, ${y}`;
    };
    const fmtMs = ms => {
      const s = Math.round(ms / 1000);
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
      return h ? `${h}:${pad(m)}:${pad(r)}` : `${m}:${pad(r)}`;
    };
    const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);

    function player(a) {
      if (!a.apple_id) {
        return `<p class="entry__noplayer">Not on Apple Music.${a.link ? ` <a href="${esc(a.link)}" target="_blank" rel="noopener">Listen here</a>.` : ''}</p>`;
      }
      const slug = (a.apple_url || '').split('/').slice(-2, -1)[0] || a.slug;
      return `<iframe loading="lazy" title="${esc(a.artist)} — ${esc(a.title)} on Apple Music"
        allow="autoplay *; encrypted-media *; clipboard-write"
        sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation"
        src="https://embed.music.apple.com/us/album/${esc(slug)}/${a.apple_id}?theme=dark"></iframe>`;
    }

    // Direct links when the data has them (links.spotify etc.); otherwise a
    // search deep link, which still lands inside the app on a phone.
    function listen(a) {
      const q = encodeURIComponent(`${a.artist} ${a.title}`);
      const L = a.links || {};
      const svcs = [
        ['Spotify', L.spotify || `https://open.spotify.com/search/${q}/albums`],
      ];
      const any = a.apple_id
        ? `<a class="listen__any mono" href="https://album.link/i/${a.apple_id}" target="_blank" rel="noopener">Open in your music app ↗</a>`
        : '';
      if (a.bonus) return any ? `<div class="listen listen--solo">${any}</div>` : '';
      return `<div class="listen">${any}${svcs.map(([n, u]) =>
        `<a class="listen__svc mono" href="${esc(u)}" target="_blank" rel="noopener">${n} ↗</a>`).join('')}</div>`;
    }

    function tracks(a) {
      if (!a.tracks || !a.tracks.length) return '';
      return `<details>
        <summary class="mono">Tracklist</summary>
        <ol class="tracks">${a.tracks.map(t => `
          <li><span class="tracks__n mono">${pad(t.n)}</span><span class="tracks__t">${esc(t.title)}</span><span class="tracks__d mono">${fmtMs(t.ms)}</span></li>`).join('')}
        </ol>
      </details>`;
    }

    // The back of the record: the real back cover when we found one, else the tracklist set in mono.
    function back(a) {
      if (a.art_back) return `<img src="../${esc(a.art_back)}" alt="" loading="lazy" onload="if (Math.max(this.naturalWidth, this.naturalHeight) / Math.min(this.naturalWidth, this.naturalHeight) < 1.08) this.classList.add('is-square')" />`;
      if (!a.tracks || !a.tracks.length) return '';
      const n = a.tracks.length, size = n > 22 ? ' is-xlong' : n > 14 ? ' is-long' : '';
      return `<ol class="flip__list mono${size}">${a.tracks.map(t =>
        `<li><span>${pad(t.n)}</span>${esc(t.title)}<span>${fmtMs(t.ms)}</span></li>`).join('')}
        <li class="flip__list-foot">${esc([a.year, a.label].filter(Boolean).join(' · '))}</li></ol>`;
    }

    function entry(a) {
      const facts = [a.year, a.label, a.track_count && `${a.track_count} tracks`, a.runtime_ms && fmtMs(a.runtime_ms)]
        .filter(Boolean).map(f => `<span>${esc(f)}</span>`).join('');
      const blurb = a.blurb && a.blurb.length
        ? a.blurb.map(p => `<p>${inline(p)}</p>`).join('')
        : `<p class="entry__blurb--empty">Blurb still cooking.</p>`;
      const head = a.bonus
        ? `<span class="entry__no">Bonus album</span><span>A reward for your curiosity.</span>`
        : `<span class="entry__no"><a href="#${pad(a.no)}">Day ${pad(a.no)}</a></span><span>${fmtDate(a.date)}</span>`;
      return `<article class="entry" id="${a.bonus ? 'bonus' : pad(a.no)}">
        <div class="entry__head mono">${head}</div>
        <div class="entry__grid">
          <button class="entry__cover-wrap" type="button" aria-label="Flip ${esc(a.title)} over" aria-pressed="false" style="display:block;width:100%;padding:0;border:0;background:none;text-align:left;">
            <div class="flip">
              ${a.art ? `<img class="entry__cover flip__front" src="../${esc(WORN && a.art_worn ? a.art_worn : a.art)}" alt="${esc(a.title)} cover" loading="lazy" />`
                      : `<div class="entry__cover entry__cover--empty flip__front" aria-label="${esc(a.title)} cover"><span>?</span></div>`}
              <div class="flip__back" aria-hidden="true">${back(a)}${WORN ? `<img class="flip__wear" src="../assets/40/wear/${esc(a.slug.replace(/-40$/, ''))}.webp" alt="" loading="lazy" /><div class="flip__paper" style="--paper:${(a.wear && a.wear.paper) || .7}"></div>` : ''}</div>
            </div>
          </button>
          <div class="entry__text">
            <p class="entry__artist">${esc(a.artist)}</p>
            <h2 class="entry__title">${esc(a.title)}</h2>
            <p class="entry__facts mono">${facts}</p>
            ${a.discovered ? `<p class="entry__found"><b>First heard:</b> ${inline(a.discovered)}</p>` : ''}
          </div>
        </div>
        <div class="entry__blurb">${blurb}</div>
        ${a.bonus ? '' : `<div class="entry__player">${player(a)}</div>`}
        ${!a.bonus || a.apple_id || (a.links && a.links.spotify) ? listen(a) : ''}
        ${a.apple_id ? '' : tracks(a)}
      </article>`;
    }

    // ── Easter egg: press a cover and it dithers out and resolves back. ──
    const BAYER = [0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,
                   3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21].map(v => v * 4);
    const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
    // The wordmark is sized from the real client width, so a desktop scrollbar never pushes it past the gutter.
    const setVW = () => document.documentElement.style.setProperty('--vw', document.documentElement.clientWidth + 'px');
    setVW(); addEventListener('resize', setVW);

    // ── The tail. Scroll is the engine. 404040 stays pinned at the top; as it rises
    //    into view an extrusion dithers in beneath it, fully there by the time the
    //    wordmark reaches the top. One real screen of runway, then every wheel tick or
    //    finger drag past the end of the page keeps turning the dial without adding
    //    scroll height, so the way back up is always one screen. The ribbon widens,
    //    twists, goes green, braids, and finally swallows the screen. Scroll the footer
    //    out of sight and it all resets. ──
    (function tail() {
      const region = document.getElementById('js-tail'), cv = document.getElementById('js-tail-cv'), ref = document.querySelector('.wordmark--top');
      const capEl = document.getElementById('js-tail-start'), bonusEl = document.getElementById('js-tail-bonus');
      if (!region || !cv || !ref || !capEl) return;
      const ctx = cv.getContext('2d');
      const TXT = [244, 241, 236], ACC = [214, 255, 56], BG = [12, 12, 13];
      const clamp = v => v < 0 ? 0 : v > 1 ? 1 : v, ease = v => v * v * (3 - 2 * v);
      const hash = (a, b) => { let h = (a * 374761393 + b * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };
      let cell = 3, W = 0, H = 0, img, buf, edge = [], fill = [], inkW = 0, inkH = 0, inkPx = 0, capX = 0, t0 = performance.now(), raf = 0, visible = false;
      let rise = 0, stuck = 0, runway = 1, virtual = 0, atEnd = false;

      function build() {
        const fs = parseFloat(getComputedStyle(ref).fontSize);
        cell = Math.min(8, Math.max(3, Math.round(fs / 48)));
        W = Math.ceil(innerWidth / cell); H = Math.ceil(innerHeight / cell);
        cv.width = W; cv.height = H; img = ctx.createImageData(W, H); buf = img.data;
        const span = ref.querySelector('span'), pxW = span.getBoundingClientRect().width + .02 * fs;
        inkPx = ref.getBoundingClientRect().height || fs * (1 - .214 - .237);
        const f = fs / cell, off = document.createElement('canvas'), o = off.getContext('2d', { willReadFrequently: true });
        o.font = `400 ${f}px Porca`;
        const track = -.06 * f, adv = [...'404040'].map(c => o.measureText(c).width + track), measured = adv.reduce((a, b) => a + b, 0) - track;
        inkW = Math.round(pxW / cell); inkH = Math.ceil(inkPx / cell);
        off.width = inkW; off.height = inkH;
        o.scale((pxW / cell) / measured, 1); o.font = `400 ${f}px Porca`; o.textBaseline = 'top'; o.fillStyle = '#fff';
        let x = -.02 * f; [...'404040'].forEach((c, i) => { o.fillText(c, x, -.214 * f); x += adv[i]; });
        const d = o.getImageData(0, 0, inkW, inkH).data, on = (x, y) => x >= 0 && y >= 0 && x < inkW && y < inkH && d[(y * inkW + x) * 4 + 3] > 128;
        edge = []; fill = [];
        for (let y = 0; y < inkH; y++) for (let x = 0; x < inkW; x++) if (on(x, y)) {
          fill.push(x, y);
          if (!on(x - 1, y) || !on(x + 1, y) || !on(x, y - 1) || !on(x, y + 1)) edge.push(x - inkW / 2, y - inkH / 2);
        }
        capX = Math.round((span.getBoundingClientRect().left + .02 * fs) / cell);
        if (capX + inkW > W) capX = Math.max(0, Math.round((W - inkW) / 2));
        capEl.style.transform = 'translateY(28px)'; capEl.style.visibility = 'visible';
      }

      // One slice of the extrusion: the outline, scaled (sx, sy) and rotated about its centre at (cx, cy).
      function slice(cx, cy, sx, sy, rot, col, b, keep) {
        if (keep <= 0 || b <= 0) return;
        const r = col[0] * b + BG[0] * (1 - b), g = col[1] * b + BG[1] * (1 - b), bl = col[2] * b + BG[2] * (1 - b);
        const cr = Math.cos(rot), sr = Math.sin(rot);
        for (let i = 0; i < edge.length; i += 2) {
          const px = edge[i] * sx, py = edge[i + 1] * sy;
          const x = Math.round(cx + px * cr - py * sr), y = Math.round(cy + px * sr + py * cr);
          if (x < 0 || y < 0 || x >= W || y >= H) continue;
          if (keep < 1 && keep * 256 <= BAYER[(y & 7) * 8 + (x & 7)]) continue;
          const k = (y * W + x) * 4; buf[k] = r; buf[k + 1] = g; buf[k + 2] = bl; buf[k + 3] = 255;
        }
      }

      function draw(now) {
        const t = (now - t0) / 1000;
        const capY = 28 / cell;
        // Appear: nothing while the wordmark is still low on screen, everything once it reaches the top.
        const appear = ease(clamp((rise - inkPx - 28) / (innerHeight - inkPx - 28)));
        const dial = Math.min(22, (stuck + virtual) / innerHeight);           // screens travelled, real plus virtual
        const clear = 0;
        // About twenty swipes in, the bonus album surfaces inside the chaos and the page grows to hold it.
        if (bonusEl) { const show = dial >= 19; if (show && bonusEl.hidden) { bonusEl.hidden = false; requestAnimationFrame(() => bonusEl.classList.add('is-in')); } else if (!show && !bonusEl.hidden) { bonusEl.hidden = true; bonusEl.classList.remove('is-in'); } }
        // One new thing per full screen. Each stage ramps in over the screen after its number.
        const st = n => ease(clamp(dial - n));
        const flow  = dial * 5;                                               // the ribbon visibly flows with every scroll
        const amp   = Math.min(W * .3, (1.5 + 7 * st(1) + Math.max(0, dial - 2) * .4) * (inkW / 120)); // 1: undulation
        const twist = st(2);                                                  // 2: twists and turns
        const tint  = st(3);                                                  // 3: green comes in
        const split = st(4);                                                  // 4: a mirrored ribbon braids in
        const take  = st(5);                                                  // 5: takes over the whole screen
        const jit   = st(6);                                                  // 6: glitches
        const melt  = ease(clamp((dial - 7) / 1.5));                          // 7: the logo dithers away
        const hard  = st(8);                                                  // 8: full meltdown, hard black and white
        const invHold = dial >= 10;                                           // 10: it inverts and stays: you're done
        const ring  = Math.max(2, 6 - Math.floor(dial / 1.5));
        // Background: a breathing dither field that surfaces during the takeover, then goes to hard black and white.
        const field = (take * .55 + hard * .45) * (1 - clear);
        for (let y = 0, i = 0; y < H; y++) for (let x = 0; x < W; x++, i += 4) {
          let on = false;
          if (field > 0) {
            // The field spreads out from the wordmark: nothing at its edge, full strength further down.
            const fy = Math.max(clamp((y - capY - inkH) / (H * .7)), hard);
            const v = .5 + .5 * Math.sin(x * .09 + t * .9 - flow * .3) * Math.sin(y * .07 - t * .7 + flow * .2) + .25 * Math.sin((x + y) * .05 + t * .5)
                    + hard * .35 * Math.sin(x * .31 + y * .23 + t * 6) * Math.sin(y * .19 - t * 4);
            on = field * fy * v * 256 > BAYER[(y & 7) * 8 + (x & 7)];
          }
          const g = on ? .18 + .1 * take + .72 * hard : 0;
          buf[i] = BG[0] + (TXT[0] - BG[0]) * g; buf[i + 1] = BG[1] + (TXT[1] - BG[1]) * g; buf[i + 2] = BG[2] + (TXT[2] - BG[2]) * g; buf[i + 3] = 255;
        }
        const step = Math.max(2, Math.round(9 / cell));
        const bottom = Math.min(H, Math.ceil(rise / cell));                    // the screen's bottom in canvas cells
        const span = H * 1.15, vanish = W / 2 - (capX + inkW / 2);
        const kEnd = Math.ceil((bottom - capY) / step) + 2;
        // Extrusion length grows with the appear phase, so it is pulled out as the wordmark climbs.
        const kMax = Math.max(0, Math.round(kEnd * appear));
        const lanes = take > 0 ? 3 : 1;
        for (let k = kMax; k >= 1; k--) {
          const y = capY + k * step;
          if (y > bottom) continue;
          const d = clamp((y - capY) / span);
          // Everything grows out of the wordmark: at the root the slice is the letters' own silhouette.
          const g = ease(clamp(d / .35));
          const sc0 = 1 - .55 * d, big = 1.1 + 1.4 * (.5 + .5 * Math.sin(k * .035 + t * .45 - flow * .2));
          const sc = sc0 + (big - sc0) * take * g;
          const wob = (amp * Math.sin(k * .21 + t * .5 - flow) + amp * .5 * Math.sin(k * .06 - t * .2 + flow * .4)) * g;
          const rot = (twist * .55 * Math.sin(k * .05 + t * .3 - flow * .3) + take * .9 * Math.sin(k * .02 + t * .25 - flow * .15)) * g;
          const sx = sc * (1 + twist * .4 * Math.sin(k * .09 + t * .7 - flow * .5) * g), sy = sc;
          // Hard contrast: slices stay white; depth and the ring cadence are carried by dither thinning, not grey.
          let b = Math.min(1, 1 - .45 * clamp((d - .3) / .7) * (1 - take * .7) + hard);
          const mix = tint * (.5 + .5 * Math.sin(k * .15 - t * 1.2 + flow)) * g;
          const col = [TXT[0] + (ACC[0] - TXT[0]) * mix, TXT[1] + (ACC[1] - TXT[1]) * mix, TXT[2] + (ACC[2] - TXT[2]) * mix];
          const onRing = (k + Math.round(dial * 6)) % ring === 0;
          let keep = (clamp(1.25 - d * 1.25) * (1 - take) + take) * appear * (onRing ? 1 : .7 + .3 * g * take) * (1 - clear);
          if (jit > 0 && hash(k + 3, Math.floor(t * 6)) < jit * .25 * g) keep *= .35;
          let dx = capX + inkW / 2 + wob + vanish * d * .9 * (1 - take);
          if (jit > 0 && hash(k, Math.floor(t * 9)) < jit * .5 * g) dx += (hash(k + 7, Math.floor(t * 9)) - .5) * 16 * jit;
          slice(dx, y + inkH / 2, sx, sy, rot, col, b, keep);
          if (split > 0) { const mx = W - dx + (dx - W / 2) * (1 - split); slice(dx + (mx - dx) * g, y + inkH / 2 + step / 2 * g, -sx, sy, -rot, col, b * .8 * split * g, keep); }
          if (lanes > 1) for (let l = -1; l <= 1; l += 2) slice(dx + l * W * .55 * take * g, y + inkH / 2 + l * step * g, sx * (1 - .2 * g), sy * (1 - .2 * g), rot * -1, col, b * .7 * take * g, keep);
        }
        // Meltdown: the crisp wordmark hands off to the pixel grid and disintegrates, pixel by pixel,
        // into the field below. Each pixel has its own release point; once released it drifts down,
        // scatters sideways, and dithers away.
        capEl.style.visibility = melt > 0 && clear < .5 ? 'hidden' : 'visible';
        if (melt > 0 && clear < .5) {
          const frame = Math.floor(t * 5);
          for (let i = 0; i < fill.length; i += 2) {
            const n = i >> 1, r = hash(n, 5);
            let x = capX + fill[i], y = Math.round(capY) + fill[i + 1], keep = 1;
            if (melt > r) {
              const f = (melt - r) / Math.max(.05, 1 - r);                    // how far gone this pixel is
              y += Math.round(f * f * H * .9 + hash(n, frame) * 4 * f);
              x += Math.round((hash(n, 9) - .5) * 40 * f + Math.sin(t * 3 + n) * 3 * f);
              keep = 1 - f;
            }
            if (x < 0 || y < 0 || x >= W || y >= H) continue;
            if (keep < 1 && keep * 256 <= BAYER[(y & 7) * 8 + (x & 7)]) continue;
            const k = (y * W + x) * 4; buf[k] = TXT[0]; buf[k + 1] = TXT[1]; buf[k + 2] = TXT[2];
          }
          // Inversion: stutters from nine, then at ten the frame stays inverted, flickering back only
          // for a frame now and then. That hold is the cue that the scroll has nothing more to give.
          const flicker = dial > 9 && hash(Math.floor(t * 4), 13) < .35 * clamp(dial - 9);
          if ((invHold ? !flicker : flicker) && clear < .5)
            for (let i = 0, n = W * H * 4; i < n; i += 4) {
              if (buf[i + 1] - buf[i + 2] > 24) continue;                  // any green-leaning pixel keeps its colour
              buf[i] = 255 - buf[i]; buf[i + 1] = 255 - buf[i + 1]; buf[i + 2] = 255 - buf[i + 2];
            }
        }
        ctx.putImageData(img, 0, 0);
      }

      function progress() {
        const r = region.getBoundingClientRect();
        rise = innerHeight - r.top; stuck = Math.max(0, -r.top); runway = Math.max(1, r.height - innerHeight);
        visible = r.bottom > 0 && rise > 0;
        atEnd = stuck >= runway - 2;
        if (r.top >= innerHeight) { virtual = 0; if (bonusEl && !bonusEl.hidden) { bonusEl.hidden = true; bonusEl.classList.remove('is-in'); } }   // footer out of sight: reset
      }
      let last = 0;
      function tick(now) { raf = 0; if (!visible) return; if (now - last > 40) { draw(now); last = now; } if (!REDUCED) raf = requestAnimationFrame(tick); }
      function kick() { progress(); if (visible && !raf) raf = requestAnimationFrame(tick); }
      addEventListener('scroll', kick, { passive: true });
      // Past the end of the page there is nothing left to scroll, so read the intent directly
      // and swallow the browser's own overscroll bounce: the gesture feeds the animation, the
      // page holds still. A new gesture the other way scrolls normally, one screen back to content.
      const inAbout = e => e.target && e.target.closest && e.target.closest('.about');
      addEventListener('wheel', e => {
        if (atEnd && e.deltaY > 0 && !REDUCED && !inAbout(e)) { e.preventDefault(); virtual += e.deltaY; kick(); }
      }, { passive: false });
      // Touch: the drag feeds the dial directly, and a fling keeps going with the same
      // deceleration as a native scroll (0.998 per ms, UIKit's normal rate), so a big swipe
      // carries on after the finger lifts.
      let ty = null, samples = [], mom = 0, momRaf = 0, momT = 0;
      const stopMomentum = () => { mom = 0; if (momRaf) cancelAnimationFrame(momRaf); momRaf = 0; };
      const momentum = now => {
        momRaf = 0; const dt = Math.min(64, now - momT); momT = now;
        if (!atEnd || mom < .02) { mom = 0; return; }
        virtual += mom * dt * 1.5; mom *= Math.pow(.998, dt); kick();
        momRaf = requestAnimationFrame(momentum);
      };
      addEventListener('touchstart', e => { stopMomentum(); ty = e.touches[0].clientY; samples = [[performance.now(), ty]]; }, { passive: true });
      addEventListener('touchmove', e => {
        if (ty === null) return;
        const y = e.touches[0].clientY, dy = ty - y; ty = y;
        samples.push([performance.now(), y]); if (samples.length > 6) samples.shift();
        if (atEnd && dy > 0 && !REDUCED && !inAbout(e)) { if (e.cancelable) e.preventDefault(); virtual += dy * 1.5; kick(); }
      }, { passive: false });
      const release = () => {
        if (ty !== null && atEnd && !REDUCED && samples.length > 1) {
          const [t0s, y0] = samples[0], [t1s, y1] = samples[samples.length - 1], dt = t1s - t0s;
          const v = dt > 0 ? (y0 - y1) / dt : 0;                          // px per ms, upward drag positive
          if (v > .3 && performance.now() - t1s < 80) { mom = Math.min(v, 6); momT = performance.now(); if (!momRaf) momRaf = requestAnimationFrame(momentum); }
        }
        ty = null; samples = [];
      };
      addEventListener('touchend', release, { passive: true });
      addEventListener('touchcancel', () => { ty = null; samples = []; }, { passive: true });
      let rw = 0; addEventListener('resize', () => { clearTimeout(rw); rw = setTimeout(() => { build(); kick(); if (REDUCED) draw(performance.now()); }, 150); });
      const start = () => { build(); if (REDUCED) { rise = innerHeight; stuck = innerHeight * .8; runway = innerHeight; draw(performance.now()); } else kick(); };
      if (params.has('debug')) window.__tail = () => ({ rise, stuck, runway, virtual, atEnd, visible });
      (document.fonts && document.fonts.load ? document.fonts.load('400 100px Porca') : Promise.resolve()).then(start, start);
    })();
    document.addEventListener('click', e => {
      const wrap = e.target.closest('.entry__cover-wrap');
      if (!wrap) return;
      const on = wrap.classList.toggle('is-flipped');
      wrap.setAttribute('aria-pressed', on);
    });

    // ── Birthday mode ────────────────────────────────────────────────────
    const BIRTHDAY = today === '2026-11-01' || params.has('birthday');
    // ?worn, ?worn=light, ?worn=heavy — each record's own sleeve wear over its cover (a test for now).
    if (WORN) {
      document.body.classList.add('is-worn');
      document.body.style.setProperty('--wear', .75);
    }
    if (BIRTHDAY) document.body.classList.add('is-birthday');

    // Pixel confetti: rounded squares in the accent, a few tiny 40s, raining
    // the whole time. Tap anywhere for a burst.
    function startConfetti() {
      if (REDUCED) return;
      const cv = document.createElement('canvas'); cv.className = 'confetti'; document.body.appendChild(cv);
      const ctx = cv.getContext('2d');
      const P = [], G = 2;                      // pixel unit
      const size = () => { cv.width = Math.ceil(innerWidth / G); cv.height = Math.ceil(innerHeight / G); cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px'; };
      size(); addEventListener('resize', size);
      const spawn = (x, y, vx, vy) => P.push({ x, y, vx, vy, s: 1 + Math.random() * 1.6, t: Math.random() * 6.28,
        forty: Math.random() < .03, c: Math.random() < .85 ? '#d6ff38' : '#f4f1ec' });
      for (let i = 0; i < 110; i++) spawn(Math.random() * cv.width, Math.random() * cv.height, 0, .4 + Math.random() * .5);
      addEventListener('pointerdown', e => {
        if (e.target.closest('a, button, iframe')) return;
        for (let i = 0; i < 30; i++) { const a = Math.random() * 6.28, v = 2 + Math.random() * 4; spawn(e.clientX / G, e.clientY / G, Math.cos(a) * v, Math.sin(a) * v - 2); }
      });
      ctx.font = '5px Porca, monospace';
      const tick = () => {
        ctx.clearRect(0, 0, cv.width, cv.height);
        for (let i = P.length - 1; i >= 0; i--) {
          const p = P[i]; p.t += .05; p.vy = Math.min(p.vy + .02, 1.6); p.vx *= .98;
          p.x += p.vx + Math.sin(p.t) * .3; p.y += p.vy;
          if (p.y > cv.height + 4) { if (P.length > 110) { P.splice(i, 1); continue; } p.y = -4; p.x = Math.random() * cv.width; p.vy = .4 + Math.random() * .5; p.vx = 0; }
          ctx.fillStyle = p.c;
          if (p.forty) ctx.fillText('40', Math.round(p.x), Math.round(p.y));
          else { const x = Math.round(p.x), y = Math.round(p.y), s = Math.max(1, Math.round(p.s)); if (s > 2) { ctx.fillRect(x + 1, y, s - 2, s); ctx.fillRect(x, y + 1, s, s - 2); } else ctx.fillRect(x, y, s, s); }
        }
        requestAnimationFrame(tick);
      };
      tick();
    }

    // Happy Birthday in square waves, on a tap of the big wordmark.
    function chiptune(el) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const ac = chiptune.ac || (chiptune.ac = new AC()); ac.resume();
      const N = { G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
      const tune = [['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
                    ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
                    ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
                    ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2]];
      const beat = .42; let t = ac.currentTime + .05;
      el.classList.add('is-playing');
      for (const [n, d] of tune) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'square'; o.frequency.value = N[n];
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.08, t + .01); g.gain.setValueAtTime(.08, t + d * beat - .06); g.gain.linearRampToValueAtTime(0, t + d * beat - .01);
        o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d * beat); t += d * beat;
      }
      setTimeout(() => el.classList.remove('is-playing'), (t - ac.currentTime) * 1000);
    }

    if (BIRTHDAY) {
      startConfetti();
      document.querySelectorAll('.wordmark').forEach(w => { w.setAttribute('role', 'button'); w.removeAttribute('aria-hidden'); w.setAttribute('aria-label', 'Play Happy Birthday'); w.tabIndex = 0;
        w.addEventListener('click', () => chiptune(w)); w.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') chiptune(w); }); });
    }

    // The 40th cell arrives with a dither pulse on the day, instead of just being there.
    function arrive(cell) {
      const img = cell.querySelector('img');
      const go = () => {
        cell.classList.add('is-arriving');
        const cv = document.createElement('canvas'); cell.appendChild(cv);
        const r = cell.getBoundingClientRect(); cv.width = cv.height = Math.round(r.width * devicePixelRatio);
        const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
        const small = document.createElement('canvas'), sctx = small.getContext('2d', { willReadFrequently: true });
        const steps = [0, 8, 16, 32, 64]; let i = 0;
        const frame = () => {
          const g = steps[i];
          ctx.clearRect(0, 0, cv.width, cv.height);
          if (g === 0) { ctx.fillStyle = '#0c0c0d'; ctx.fillRect(0, 0, cv.width, cv.height); }
          else {
            small.width = small.height = g; sctx.drawImage(img, 0, 0, g, g);
            let px; try { px = sctx.getImageData(0, 0, g, g).data; } catch (e) { cv.remove(); return; }
            const out = sctx.createImageData(g, g);
            for (let y = 0; y < g; y++) for (let x = 0; x < g; x++) { const k = (y * g + x) * 4;
              const l = ((0.299 * px[k] + 0.587 * px[k + 1] + 0.114 * px[k + 2]) - 128) * 1.2 + 128, on = l > BAYER[(y & 7) * 8 + (x & 7)];
              out.data[k] = on ? 244 : 12; out.data[k + 1] = on ? 241 : 12; out.data[k + 2] = on ? 236 : 13; out.data[k + 3] = 255; }
            sctx.putImageData(out, 0, 0); ctx.drawImage(small, 0, 0, cv.width, cv.height);
          }
          i++; if (i < steps.length) setTimeout(frame, 160); else setTimeout(() => { cv.remove(); cell.classList.remove('is-arriving'); }, 160);
        };
        frame();
      };
      if (img.complete && img.naturalWidth) go(); else img.addEventListener('load', go, { once: true });
    }

    fetch(DATA + '?v=' + Date.now())
      .then(r => r.json())
      .then(({ meta, albums }) => {
        const slotted = albums.filter(a => a.no && a.date && !a.bonus).sort((x, y) => x.no - y.no);
        const live    = slotted.filter(a => preview || a.date <= today);

        // About panel: collapsed by default, since most visits are repeat
        // visits from a story. Opens itself only when there's nothing else
        // on the page yet.
        const about = document.getElementById('js-about');
        const btn   = document.getElementById('js-about-btn');
        const setOpen = open => {
          about.hidden = !open;
          btn.setAttribute('aria-expanded', String(open));
          btn.textContent = open ? 'Close' : 'About';
          document.body.style.overflow = open ? 'hidden' : '';
        };
        btn.addEventListener('click', e => { e.stopPropagation(); setOpen(about.hidden); });

        // The small 404040 in the bar appears only once the big one is gone.
        const bar = document.querySelector('.bar');
        const big = document.querySelector('.wordmark--top');
        if (big && 'IntersectionObserver' in window) {
          new IntersectionObserver(([e]) => {
            bar.classList.toggle('is-scrolled', !e.isIntersecting && e.boundingClientRect.top < 0);
          }, { threshold: 0, rootMargin: '-48px 0px 0px 0px' }).observe(big);
        } else if (bar) {
          bar.classList.add('is-scrolled');
        }
        about.addEventListener('click', e => { e.stopPropagation(); if (e.target.closest('.grid40 a')) setOpen(false); });
        document.addEventListener('click', () => { if (!about.hidden) setOpen(false); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && !about.hidden) setOpen(false); });


        const byNo = new Map(slotted.map(a => [a.no, a]));
        document.getElementById('js-grid').innerHTML = Array.from({ length: meta.total }, (_, i) => {
          const a = byNo.get(i + 1);
          if (a && (preview || a.date <= today)) return `<a href="#${pad(a.no)}" title="Day ${pad(a.no)} · ${esc(a.artist)} — ${esc(a.title)}"><img src="../${esc((WORN && a.art_worn) || a.art || '')}" alt="" loading="lazy"></a>`;
          return `<span class="${a && a.date === today ? 'is-today' : ''}" aria-hidden="true">${pad(i + 1)}</span>`;
        }).join('');
        const last = document.querySelector('#js-grid a:nth-child(40)');
        if (BIRTHDAY && last && !REDUCED && 'IntersectionObserver' in window) {
          new IntersectionObserver((es, io) => { if (es[0].isIntersecting) { io.disconnect(); setTimeout(() => arrive(last), 500); } }, { threshold: .6 }).observe(last);
        }

        // The bonus record lives in the albums list flagged `bonus`, outside the countdown and the grid.
        const bonusEl = document.getElementById('js-tail-bonus'), bonusRec = albums.find(a => a.bonus);
        if (bonusEl && bonusRec) bonusEl.innerHTML = entry(Object.assign({ no: 0 }, bonusRec));

        const feed = document.getElementById('js-feed');
        if (!live.length) {
          const n = daysBetween(today, meta.start);
          feed.innerHTML = `<b>Day 01 drops ${fmtDate(meta.start)}.</b>` +
            (n > 0 ? ` ${n} day${n === 1 ? '' : 's'} out.` : '');
          return;
        }
        feed.className = '';
        // Newest on top, like a blog.
        feed.innerHTML = live.slice().reverse().map(entry).join('');
        if (location.hash) {
          const el = document.getElementById(location.hash.slice(1));
          if (el) el.scrollIntoView();
        }
      })
      .catch(err => {
        document.getElementById('js-feed').textContent = 'Could not load albums.json — ' + err.message;
      });
  })();
  </script>
</body>
