<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>40 albums · 40 days — drewroper</title>
  <meta name="description" content="40 albums that shaped me, one a day, before I turn 40." />
  <meta name="theme-color" content="#0c0c0d" />
  <link rel="icon" type="image/svg+xml" href="../assets/dr-logo.svg" />
  <meta property="og:title" content="40 albums · 40 days" />
  <meta property="og:description" content="40 albums that shaped me, one a day, before I turn 40." />
  <meta property="og:url" content="https://drewroper.com/40" />
  <meta property="og:image" content="https://drewroper.com/assets/og-image.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* Same type system as the homepage: Geist for reading, Geist Mono at
       11px for labels and metadata. The About H1 is Porca, self-hosted. */
    @font-face {
      font-family: 'Porca'; font-weight: 400; font-display: swap;
      src: url('../assets/fonts/Porca.otf') format('opentype');
    }
    :root {
      --bg:         #0c0c0d;
      --bg-raised:  #131315;
      --rule:       #262628;
      --text:       #f4f1ec;
      --text-muted: #8c8a86;
      --text-faint: #56544f;
      --accent:     #d6ff38;
      --font-display: 'Porca', 'Geist Mono', ui-monospace, monospace;
      --font-sans:    'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      --font-mono:    'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      --mono-size: 11px;
      --display-size: clamp(56px, 17vw, 140px);   /* About lines and album names share this */
      --gutter: 20px;                             /* page edge, scales up on desktop */
      --page-max: 640px;
      --vw: 100vw;                                /* set by JS to the real client width (no scrollbar) */
      --measure: 60ch;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    :root { --sab: env(safe-area-inset-bottom, 0px); }
    html { background: var(--bg); scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    ::selection { background: var(--accent); color: var(--bg); }
    a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--text-faint); }
    a:hover { color: var(--accent); border-bottom-color: var(--accent); }

    /* Label voice — every small-caps mono string on the page. */
    .mono {
      font-family: var(--font-mono); font-size: var(--mono-size);
      letter-spacing: .08em; text-transform: uppercase;
    }

    /* Mobile-first. One column, phone width; the desktop gets a little
       more room but the same structure. */
    .page { max-width: var(--page-max); margin: 0 auto; padding: 0 var(--gutter) 0; }

    /* ── Top bar, same recipe as the homepage: brand mark left, title
       centered, Index and About right; mono, translucent, hairline. Both
       panels hang off it as dropdowns, so they open wherever you are. ── */
    .bar { position: sticky; top: 0; z-index: 50; margin: 0 calc(-1 * var(--gutter)); }
    .bar__row {
      position: relative; z-index: 1;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: .75rem;
      min-height: 48px; padding: .6rem var(--gutter) .55rem;
      letter-spacing: .04em;
      background: rgba(12,12,13,.78);
      backdrop-filter: saturate(140%) blur(10px);
      -webkit-backdrop-filter: saturate(140%) blur(10px);
      border-bottom: 1px solid var(--rule);
    }
    .bar__brand { justify-self: start; color: var(--text-muted); border: 0; display: inline-flex; }
    .bar__brand:hover { color: var(--accent); }
    .brand-mark { height: 1em; width: auto; display: inline-block; vertical-align: -0.12em; font-size: 14px; }
    .bar__name { justify-self: center; margin: 0; white-space: nowrap;
                 font-family: var(--font-display); font-size: 22px; line-height: 1; letter-spacing: -.06em; color: var(--text);
                 opacity: 0; transform: translateY(14px); pointer-events: none;
                 transition: opacity .35s ease, transform .45s cubic-bezier(.2,.7,.2,1); }
    .bar.is-scrolled .bar__name { opacity: 1; transform: none; pointer-events: auto; }
    @media (prefers-reduced-motion: reduce) { .bar__name { transition: none; } }
    /* Once it's there, the small 404040 takes you back to the top. */
    a.bar__name { display: grid; justify-items: center; border: 0; text-transform: none; -webkit-tap-highlight-color: transparent; }
    .bar__word, .bar__back { grid-area: 1 / 1; }
    .bar__back { visibility: hidden; letter-spacing: .04em; word-spacing: .1em; }   /* words get normal tracking; 404040 keeps its tight -.06em */
    @media (hover: hover) {
      a.bar__name:hover { color: var(--accent); }
      a.bar__name:hover .bar__word { visibility: hidden; }
      a.bar__name:hover .bar__back { visibility: visible; }
    }
    /* The wordmark: 404040 edge to edge, top of the page and bottom. Porca's
       ink sits .214em below a 1em line box's top and .237em above its bottom,
       so the box is clipped to the ink height and the glyphs shifted up —
       then gutters are measured from the ink, not the box. */
    .wordmark {
      font-family: var(--font-display); font-size: calc((min(var(--vw), var(--page-max)) - 2 * var(--gutter)) / 2.368); line-height: 1;
      letter-spacing: -.06em; color: var(--text); white-space: nowrap;
      height: calc(1em - .214em - .237em); overflow: hidden;
      margin: 0 0 0 -.02em; user-select: none;
    }
    .wordmark > span { display: block; margin-top: -.214em; }
    .wordmark--top  { margin-top: 24px; margin-bottom: 20px; }
    /* Tap a letter and it dithers to lime; tap again and it goes back. The type itself is never
       split up (separate letter boxes lose Porca's kerning and drift wider in Safari): a lime copy of
       the same text sits exactly on top, masked down to the tapped letters' shapes. */
    .wordmark--top { position: relative; cursor: crosshair; -webkit-tap-highlight-color: transparent; }
    .wordmark__lime { position: absolute; left: 0; top: 0; width: 100%; color: var(--accent); pointer-events: none;
                      -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; }
    .wordmark__lime[hidden] { display: none; }
    .bar__nav { justify-self: end; display: flex; align-items: center; gap: 6px; }
    /* Index: a small grid glyph beside About; opens every day of the countdown as a dropdown. */
    .bar__index {
      width: 27px; height: 27px; padding: 0; display: grid; place-items: center; flex: none;
      color: var(--text-muted); background: none; border: 1px solid var(--rule); border-radius: 50%; cursor: pointer;
      -webkit-tap-highlight-color: transparent; transition: color .15s ease, border-color .15s ease;
    }
    .bar__index svg { display: block; }
    .bar__index .i-close, .bar__index[aria-expanded="true"] .i-grid { display: none; }
    .bar__index[aria-expanded="true"] .i-close { display: block; }
    @media (hover: hover) { .bar__index:hover { color: var(--text); border-color: var(--text-faint); } }
    .bar__index[aria-expanded="true"], .bar__index[aria-expanded="true"]:hover { color: var(--accent); border-color: var(--accent); }
    .bar__about {
      font: inherit; letter-spacing: inherit; text-transform: inherit;
      color: var(--text-muted);
      background: none; border: 1px solid var(--rule); border-radius: 999px;
      padding: 4px 11px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: color .15s ease, border-color .15s ease;
    }
    @media (hover: hover) { .bar__about:hover { color: var(--text); border-color: var(--text-faint); } }
    .bar__about[aria-expanded="true"], .bar__about[aria-expanded="true"]:hover { color: var(--accent); border-color: var(--accent); }

    /* ── About: a full-screen type poster under the bar. Closed on load.
       Every line is the H1 size; lines are hand-broken so none wraps. ── */
    .about, .index {
      position: fixed; inset: 0; z-index: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
      background: rgba(12,12,13,.82); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%);
      padding: 64px var(--gutter) calc(20px + var(--sab));
      display: flex; flex-direction: column; box-sizing: border-box;
      font-family: var(--font-sans); text-transform: none; letter-spacing: 0;
    }
    .about[hidden], .index[hidden] { display: none; }
    .about > *, .index > * { flex: none; }
    .about__title {
      margin: 0; padding: 0; max-width: 760px;
      font-family: var(--font-display); font-weight: 400; color: var(--text);
      font-size: min(var(--display-size), 10vh, 10dvh); line-height: .8; letter-spacing: 0;
    }
    .about__title > * { display: block; white-space: nowrap; margin-left: -.03em; }
    /* Same stack as an entry: Porca title, mono facts line, Geist blurb. */
    .about__body  { max-width: var(--measure); margin: 20px 0 0; color: var(--text); font-size: 16px; line-height: 1.55; font-weight: 300; }
    /* One line: the disclaimer on the left, the dates on the right. */
    .about__meta  { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; flex-wrap: wrap; max-width: 560px; margin: 12px 0 0; }
    .about__quiet { margin: 0; color: var(--text-faint); font-size: 14px; line-height: 1.5; font-weight: 300; }
    /* The project blurb: under the dates on a phone, its own column on desktop. From meta.about. */
    .about__project { max-width: var(--measure); margin: 24px 0 0; padding-top: 20px; border-top: 1px solid var(--rule); color: var(--text-muted); font-size: 15px; line-height: 1.6; font-weight: 300; }
    .about__project p { margin: 0 0 1em; }
    .about__project p:last-child { margin-bottom: 0; }
    .about__project em { font-style: italic; }
    .about__project[hidden] { display: none; }
    .about__facts { margin: 0; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; font-family: var(--font-mono); font-size: var(--mono-size); white-space: nowrap; }
    /* Index: the 40 days, as big as the screen allows — 5 across on a phone (8 rows), 8 across from 720px. */
    .index__meta { display: flex; justify-content: space-between; gap: 16px; margin: 0 0 14px; color: var(--text-faint); }
    .index .grid40 { grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: none; }   /* phone: gutter to gutter; the panel scrolls if the screen is short */
    .index .grid40 span { font-size: 11px; }
    /* iOS WebKit ignores a scrolling panel's bottom padding, so the last thing in it carries the room. */
    @media (max-width: 1023px) {
      .about, .index { padding-bottom: 0; }
      .index .grid40, .about > :last-child { margin-bottom: calc(44px + var(--sab)); }
    }
    @media (max-height: 620px) {
      .about { padding-top: 58px; }
      .about__title { font-size: min(var(--display-size), 8.6vh); }
      .about__body { font-size: 15px; margin-top: 14px; }
      .about__meta { margin-top: 8px; }
      .index { padding-top: 58px; }
    }
    .about__title em { font-style: normal; color: var(--accent); }
    .about__title .is-quiet { color: var(--text-faint); }
    .about__title .is-date { color: var(--accent); }
    .about__title .is-gap { height: .5em; }
    @media (prefers-reduced-motion: no-preference) {
      .about:not([hidden]) .about__title > *, .about:not([hidden]) .about__meta, .about:not([hidden]) .about__body, .about:not([hidden]) .about__project,
      .index:not([hidden]) .index__meta, .index:not([hidden]) .grid40 { animation: rise .42s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 60ms); }
      @keyframes rise { from { opacity: 0; transform: translateY(.35em); } to { opacity: 1; transform: none; } }
    }

    /* ── Entries: newest first, cover is the hero at phone width. ────── */
    .entry { padding: 24px 0 40px; border-bottom: 1px solid var(--rule); scroll-margin-top: 56px; }
    .entry__head { display: flex; justify-content: space-between; align-items: baseline; color: var(--text-faint); }
    .entry__no { color: var(--accent); }
    .entry__no a { color: inherit; border: 0; }
    .entry__no a:hover { color: var(--text); }

    .entry__cover {
      display: block; width: 100%; aspect-ratio: 1; object-fit: cover; margin-top: 16px;
      background: var(--bg-raised); border: 1px solid var(--rule); border-radius: 2.8%;
    }
    /* Sleeves are rounded at 2.8% of their width (≈10px on a phone), the same proportion the wear is baked to. */
    .entry__cover-wrap { position: relative; margin-top: 16px; cursor: pointer; -webkit-tap-highlight-color: transparent; perspective: 1400px; overflow: visible; }
    /* Flip hint: the icon alone, in a small glass disc on the art. Hairline arrow to match the
       mono labels; it turns with the sleeve. Taps land on the button it sits in. */
    .flip-hint { position: absolute; z-index: 3; right: 10px; bottom: 10px; width: 36px; height: 36px;
      display: grid; place-items: center; border-radius: 50%; color: var(--text);
      background: rgba(34, 34, 36, .4); border: 1px solid rgba(244, 241, 236, .2);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .flip-hint svg { display: block; transition: transform .75s cubic-bezier(.2, .75, .15, 1); }
    .is-flipped .flip-hint svg { transform: rotate(180deg); }
    @media (prefers-reduced-motion: reduce) { .flip-hint svg { transition: none; } }
    .entry__cover-wrap .entry__cover { margin-top: 0; }
    /* Tap the cover and it flips over to the back of the record. */
    .flip { position: relative; aspect-ratio: 1; transform-style: preserve-3d; transition: transform .75s cubic-bezier(.2, .75, .15, 1); }
    .is-flipped .flip { transform: rotateY(180deg); }
    .flip__front, .flip__back { -webkit-backface-visibility: hidden; backface-visibility: hidden; }
    .flip__back {
      position: absolute; inset: 0; transform: rotateY(180deg);
      background: var(--bg-raised); border: 1px solid var(--rule); border-radius: 2.8%; overflow: hidden;
      display: grid; place-items: center;
    }
    .flip__back img { display: block; width: 100%; height: 100%; object-fit: contain; -webkit-backface-visibility: hidden; backface-visibility: hidden; }
    .flip__back img.is-square { object-fit: cover; }
    .flip__list { margin: 0; padding: 18px 20px; width: 100%; height: 100%; box-sizing: border-box; list-style: none; display: flex; flex-direction: column; justify-content: center; font-size: 11px; line-height: 1.5; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); }
    .flip__list li { display: flex; gap: 10px; }
    .flip__list li span:first-child { color: var(--text-faint); flex: none; width: 2em; }
    .flip__list li span:last-child { color: var(--text-faint); margin-left: auto; padding-left: 8px; }
    .flip__list.is-long { font-size: 9.5px; padding: 14px 16px; }
    .flip__list.is-xlong { font-size: 8px; line-height: 1.4; }
    .flip__list-foot { margin-top: 10px; color: var(--text-faint); font-size: 8.5px; }
    @media (prefers-reduced-motion: reduce) { .flip { transition: none; } }
    .entry__artist { margin: 20px 0 0; color: var(--text-muted); font-size: 15px; }
    .entry__title  {
      margin: 8px 0 0 -3px; color: var(--text);
      font-family: var(--font-display); font-weight: 400;
      font-size: var(--display-size); line-height: .92; letter-spacing: 0;
    }
    .entry__facts  { margin: 12px 0 0; color: var(--text-faint); }
    .entry__facts span + span::before { content: ' · '; }
    .entry__found  { margin: 14px 0 0; color: var(--text-muted); font-size: 14px; }
    .entry__found b { font-weight: 400; color: var(--text-faint); margin-right: .4em; }

    .entry__blurb { max-width: var(--measure); margin: 24px 0 0; color: var(--text); font-size: 17px; line-height: 1.6; font-weight: 300; }
    .entry__blurb p { margin: 0 0 1.1em; }
    .entry__blurb p:last-child { margin-bottom: 0; }
    .entry__blurb em { font-style: italic; }
    .entry__blurb--empty { color: var(--text-faint); }

    .entry__player { margin: 26px 0 0; }
    .entry__player iframe { width: 100%; height: 450px; border: 0; overflow: hidden; background: transparent; border-radius: 10px; }
    .entry__noplayer { color: var(--text-faint); font-size: 14px; }
    /* The player: no Apple chrome, no second cover. The tracklist is the player:
       tap a track for Apple's 30-second preview, or play to run through the record. */
    .pv { border-top: 1px solid var(--rule); }
    .pv__head { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--rule); color: var(--text-muted); }
    .pv__play { flex: none; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border-radius: 50%;
      color: var(--text); background: none; border: 1px solid var(--rule); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .pv__play .pv__pause, .pv.is-playing .pv__play .pv__go { display: none; }
    .pv.is-playing .pv__play .pv__pause { display: block; }
    .pv.is-playing .pv__play { border-color: var(--accent); color: var(--accent); }
    .pv__now { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pv.is-live .pv__now { color: var(--text); }
    .pv__time { flex: none; color: var(--text-faint); font-variant-numeric: tabular-nums; }
    .pv__list { margin: 0; padding: 0; list-style: none; }
    .pv__list li { position: relative; border-bottom: 1px solid var(--rule); }
    .pv__row { display: flex; align-items: baseline; gap: 12px; width: 100%; padding: 9px 0; margin: 0; border: 0; background: none; color: var(--text-muted);
      font: inherit; font-size: 15px; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .pv__row:disabled { cursor: default; opacity: .5; }
    .pv__n { flex: none; width: 2.2em; text-align: right; color: var(--text-faint); }
    .pv__t { flex: 1; min-width: 0; }
    .pv__d { flex: none; color: var(--text-faint); }
    @media (hover: hover) { .pv__row:not(:disabled):hover { color: var(--text); } }
    .pv__list li.is-on .pv__row { color: var(--text); }
    .pv__list li.is-on .pv__n { color: var(--accent); }
    .pv__bar { position: absolute; left: 0; bottom: -1px; height: 1px; width: calc(var(--p, 0) * 100%); background: var(--accent); pointer-events: none; }

    /* Listen: Apple Music, Spotify, Pick your app (album.link). On a phone the first runs full
       width with the other two paired beneath it; from 720px up they share one row. */
    /* Selectors are deliberately heavier than the page's global a:hover,
       which would otherwise repaint these on hover / stuck iOS hover. */
    .listen { margin: 22px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .listen a:first-child:not(:only-child) { flex-basis: 100%; }
    .listen.listen--solo a, .listen.listen--solo a:only-child { flex: 1 1 100%; max-width: none; }
    .listen a {
      flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px 14px; border-radius: 999px; white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: color .15s ease, background .15s ease, border-color .15s ease;
    }
    .listen a.listen__any, .listen a.listen__any:hover { color: var(--accent); background: none; border: 1px solid var(--accent); }
    .listen a.listen__svc, .listen a.listen__svc:hover { color: var(--text-muted); background: none; border: 1px solid var(--rule); }
    @media (hover: hover) {
      .listen a.listen__any:hover { color: var(--bg); background: var(--accent); }
      .listen a.listen__svc:hover { color: var(--text); border-color: var(--text-faint); }
    }
    .listen a.listen__any:active { color: var(--bg); background: var(--accent); }
    .listen a.listen__svc:active { color: var(--text); border-color: var(--text-faint); }

    details { margin: 18px 0 0; }
    summary { cursor: pointer; color: var(--text-faint); list-style: none; user-select: none; }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: '▸ '; }
    details[open] summary::before { content: '▾ '; }
    summary:hover { color: var(--text); }
    .tracks { margin: 12px 0 0; padding: 0; list-style: none; font-size: 14px; }
    .tracks li { display: flex; align-items: baseline; gap: 12px; padding: 3px 0; }
    .tracks__n { color: var(--text-faint); flex: none; width: 2.2em; text-align: right; }
    .tracks__t { color: var(--text-muted); flex: 1; }
    .tracks__d { color: var(--text-faint); flex: none; }

    .empty { padding: 48px 0; color: var(--text-faint); font-size: 17px; font-weight: 300; border-bottom: 1px solid var(--rule); }
    .empty b { color: var(--text); font-weight: 400; }

    /* ── Footer: a real one, with room to grow. ─────────────────────── */
    .foot { padding: 36px 0 32px; color: var(--text-faint); }   /* breathing room before the tail starts */
    .foot__links { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0; padding: 0; list-style: none; }
    .foot__links a { color: var(--text-muted); border-bottom-color: transparent; }
    .foot__links a:hover { color: var(--accent); border-bottom-color: var(--accent); }
    .foot__count span { color: var(--text-muted); font-variant-numeric: tabular-nums; }
    /* ── Birthday mode: Nov 1, or ?birthday to preview. ───────────────── */
    .confetti { position: fixed; inset: 0; z-index: 30; pointer-events: none; image-rendering: pixelated; }
    .is-birthday .wordmark { cursor: pointer; user-select: none; }
    .is-birthday .wordmark.is-playing > span { animation: hop .28s steps(2, jump-none) infinite; }
    @keyframes hop { 50% { transform: translateY(-.04em); } }
    .grid40 a.is-arriving { position: relative; }
    .grid40 a.is-arriving canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }

    /* The 40 cells from the closing card, filling in as records post. */
    .grid40 { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin: 0; max-width: 560px; }
    @media (min-width: 720px) { .index .grid40 { grid-template-columns: repeat(8, 1fr); max-width: min(100%, calc((100vh - 150px) * 1.6)); } .index__meta { max-width: min(100%, calc((100vh - 150px) * 1.6)); } }
    /* Past the footer wordmark the 404040 repeats, each copy more eroded by dither, until nothing is left. */
    /* ── The tail: scroll pulls a pixel extrusion out of 404040 and you travel down it. ── */
    .tail { position: relative; }
    html:not(.is-ready) .tail { visibility: hidden; }   /* until the feed renders: on an empty page the tail would be all you see */
    .tail__stage { position: sticky; top: 0; height: 100vh; height: 100dvh; overflow: hidden; }
    .tail__cv { position: absolute; inset: 0; display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
    .tail__col { position: relative; height: 100%; }
    .tail__cap { position: absolute; top: 0; left: var(--gutter); right: var(--gutter); will-change: transform; visibility: hidden; }   /* gutter to gutter, like the top one, so the last 0 isn't clipped */
    /* The bonus album: surfaces inside the chaos about twenty swipes in, laid out like any entry,
       on a translucent panel so the tunnel keeps moving around and through it. */
    .tail { height: auto; min-height: 160vh; min-height: 160dvh; }
    .tail__bonus { position: relative; z-index: 2; margin-top: 100vh; margin-top: 100dvh; padding-bottom: 40px; opacity: 0; transition: opacity .6s ease; }
    .tail__bonus[hidden] { display: none; }
    .tail__bonus.is-in { opacity: 1; }
    /* Docked: once you head back up from the bonus, the screen of chaos above it goes and the record
       rides on top of the footer, so the two leave together and the page is right there above them. */
    .tail.is-docked { min-height: 0; }
    .tail.is-docked .tail__bonus { margin-top: calc(-100vh + var(--dock-gap, 40px)); margin-top: calc(-100dvh + var(--dock-gap, 40px)); }   /* the tail shows above it too */
    @media (min-width: 1024px) { .tail.is-docked .tail__bonus { --dock-gap: 72px; } }
    .tail__bonus .entry { border: 1px solid var(--rule); border-radius: 14px; padding: 24px 20px 32px; background: rgba(12,12,13,.78); backdrop-filter: blur(10px) saturate(120%); -webkit-backdrop-filter: blur(10px) saturate(120%); }
    .tail__bonus .entry__head { color: var(--text-faint); }
    .tail__bonus .entry__title { font-size: min(var(--display-size), 11vw); overflow-wrap: anywhere; }
    .entry__cover--empty { display: grid; place-items: center; font-family: var(--font-display); font-size: clamp(64px, 20vw, 120px); color: var(--text-faint); letter-spacing: -.04em; }
    @media (min-width: 1024px) { .tail__bonus .entry { padding: 48px 40px 56px; } }
    @media (prefers-reduced-motion: reduce) { .tail { height: 100vh; height: 100dvh; } }

    /* ── The secret album. "Curiosity" in the bonus header is a button (help cursor, nowhere else);
       it shimmers lime once a minute after ten seconds on the bonus. Clicking it flips the whole
       page negative, rattles it, and a record drops in through the dither. ── */
    .egg { font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0;
           cursor: help; -webkit-tap-highlight-color: transparent; }
    .egg:hover, .egg:focus-visible { color: var(--accent); outline: none; }
    .egg.is-shimmer { color: transparent; -webkit-background-clip: text; background-clip: text;
                      background-image: linear-gradient(100deg, var(--text-faint) 0 38%, var(--accent) 50%, var(--text-faint) 62% 100%);
                      background-size: 260% 100%; background-position: 100% 0; animation: egg-shimmer 1.3s cubic-bezier(.4,0,.2,1) 1; }
    @keyframes egg-shimmer { to { background-position: 0 0; } }
    html.is-negative { filter: invert(1); }
    .is-rattling main { animation: rattle .5s steps(1, end) 1; }
    @keyframes rattle {
      0%   { transform: translate(0, 0) skewX(0); }
      12%  { transform: translate(-14px, 6px) skewX(4deg); }
      24%  { transform: translate(18px, -10px) skewX(-6deg); }
      36%  { transform: translate(-6px, 14px) rotate(-1deg); }
      48%  { transform: translate(22px, 2px) skewX(3deg); }
      60%  { transform: translate(-20px, -6px) rotate(1.2deg); }
      72%  { transform: translate(8px, 10px) skewX(-2deg); }
      84%  { transform: translate(-4px, -4px); }
      100% { transform: none; }
    }
    .secret { position: fixed; inset: 0; z-index: 200; overflow-y: auto; -webkit-overflow-scrolling: touch;
              display: grid; justify-items: center; align-items: start; padding: 72px var(--gutter) calc(40px + var(--sab));
              background: rgba(12,12,13,.5); }
    .secret[hidden] { display: none; }
    .secret__panel { position: relative; width: 100%; max-width: 1200px; background: var(--bg); border: 1px solid var(--accent); border-radius: 14px;
                     padding: 20px 20px 32px; filter: invert(1); }   /* the page is negative; the record stays true */
    .secret__close { position: absolute; top: 14px; right: 14px; z-index: 2; font: inherit; font-family: var(--font-mono); font-size: var(--mono-size);
                     letter-spacing: .08em; text-transform: uppercase; color: var(--accent); background: none; border: 1px solid var(--accent);
                     border-radius: 999px; padding: 4px 11px; cursor: pointer; }
    .secret .entry { border: 0; margin: 0; padding: 0; }
    .secret .entry__head { padding-right: 88px; }
    @media (min-width: 1024px) { .secret__panel { padding: 40px 40px 56px; } }

    .grid40 > * { display: block; aspect-ratio: 1; border-radius: 4px; overflow: hidden; }
    .grid40 span { border: 1px solid var(--rule); display: grid; place-items: center; font: 400 9px/1 var(--font-mono); letter-spacing: .06em; color: var(--text-faint); opacity: .8; user-select: none; }
    .grid40 span.is-today { border-color: var(--accent); color: var(--accent); }
    .grid40 a { border: 0; }
    .grid40 a img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .grid40 a:hover img { opacity: .8; }

    /* Desktop gets the cover beside the title; everything else stays. */
    @media (min-width: 720px) {
      :root { --page-max: 760px; }
      .entry__grid { display: grid; grid-template-columns: 220px 1fr; gap: 28px; align-items: start; }
      .entry__cover { margin-top: 0; }
      .entry__artist { margin-top: 0; }
      .entry__grid { margin-top: 20px; }
      .listen { flex-wrap: nowrap; }
      .listen a, .listen a:first-child:not(:only-child) { flex: 0 1 auto; }
      .tracks { columns: 2; column-gap: 32px; }
      .tracks li { break-inside: avoid; }
    }

    /* ── Desktop: the wordmark goes wall to wall, entries become two columns with the
       cover as a large sticky object, About becomes a spread with the grid on the right. ── */
    @media (min-width: 1024px) {
      :root { --gutter: 40px; --page-max: 1440px; --display-size: clamp(64px, 6.4vw, 112px); }
      .wordmark--top { margin-top: 40px; margin-bottom: 24px; }   /* longhands: the shorthand would reset the -.02em ink offset */
      .entry {
        display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); column-gap: 72px;
        grid-template-areas: "cover head" "cover text" "cover blurb" "cover player" "cover listen" "cover tracks";
        padding: 56px 0 88px; scroll-margin-top: 48px;
      }
      .entry__head { grid-area: head; align-self: start; }
      .entry__grid { display: contents; }
      .entry .entry__cover-wrap { grid-area: cover; position: sticky; top: 72px; align-self: start; margin: 0; }
      .entry__text { grid-area: text; }
      .entry__artist { margin-top: 32px; font-size: 17px; }
      .entry__title { margin-top: 8px; }
      .entry__blurb { grid-area: blurb; max-width: 62ch; font-size: 18px; }
      .entry__player { grid-area: player; max-width: 660px; }
      .entry .listen { grid-area: listen; max-width: 660px; }
      .entry details { grid-area: tracks; }
      .about, .index { justify-content: center; padding-top: 48px; max-width: var(--page-max); box-sizing: border-box; margin: 0 auto; }
      .about[hidden], .index[hidden] { display: none; }
      /* Two equal halves with the divider on the centre line of the screen. The title is sized from
         the half it sits in (its widest line, "40 albums,", runs 3.97em), capped by the screen height. */
      .about { container-type: inline-size; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 0; align-content: safe center; align-items: start; padding-bottom: 48px; }   /* safe: a long blurb scrolls instead of sliding under the bar */
      .about__lead { padding-right: 56px; display: flex; flex-direction: column; }
      /* The dates become the eyebrow over the title; the disclaimer tucks under the line it qualifies. */
      .about__lead .about__meta { display: contents; }
      .about__lead .about__facts { order: -1; margin: 0 0 22px; }
      .about__lead .about__quiet { margin-top: 10px; font-size: 15px; }
      .about__title { font-size: min(170px, 18vh, calc((50cqw - 56px) / 4.02)); font-size: min(170px, 18dvh, calc((50cqw - 56px) / 4.02)); }
      .about__body { font-size: 18px; max-width: none; margin-top: 30px; }
      .about__meta { max-width: none; }
      .about__project { align-self: start; margin: 0; padding: .35em 0 .35em 56px; border: 0; border-left: 1px solid var(--rule); font-size: 16px; line-height: 1.55; max-width: calc(54ch + 56px); }
      .index .grid40 { max-width: min(100%, 1200px, calc((100vh - 170px) * 1.6)); gap: 10px; margin: 0 auto; }
      .index__meta { width: 100%; max-width: min(100%, 1200px, calc((100vh - 170px) * 1.6)); margin: 0 auto 18px; }
      .grid40 span, .index .grid40 span { font-size: 12px; }
      .foot { padding-top: 48px; padding-bottom: 44px; }
    }

  </style>
</head>
<body>
  <main class="page">
    <header class="bar mono" aria-label="Site meta">
      <div class="bar__row">
      <a class="bar__brand" href="/" aria-label="Drew Roper — home">
        <svg class="brand-mark" viewBox="0 0 71 58" aria-hidden="true" focusable="false">
          <path fill="currentColor" fill-rule="evenodd" d="M40.508 0H0v8.395h40.508c12.207 0 21.77 9.05 21.77 20.603 0 10.936-8.564 19.63-19.877 20.53l-6.288-7.554h4.116l.114.001c7.132 0 12.935-5.821 12.935-12.976 0-7.154-5.803-12.972-12.935-12.972H0v8.395h9.284v25.184H0V58h25.53v-8.395h-7.736v-7.631h7.307l12.064 14.492L38.496 58h2.012c16.979 0 30.28-12.739 30.28-29.002C70.788 12.737 57.487 0 40.508 0Zm-22.714 24.421h22.55c2.397 0 4.424 2.096 4.424 4.577 0 2.483-2.027 4.581-4.424 4.581h-.115H17.794v-9.158Z"/>
        </svg>
      </a>
      <a class="bar__name" id="js-top" href="#" aria-label="404040, back to top"><span class="bar__word">404040</span><span class="bar__back" aria-hidden="true">BACK TO TOP</span></a>
      <div class="bar__nav">
        <button class="bar__index" id="js-index-btn" type="button" aria-expanded="false" aria-controls="js-index" aria-label="Index: every day of the countdown">
          <svg class="i-grid" width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><rect x=".5" y=".5" width="5" height="5" rx=".8"/><rect x="7.5" y=".5" width="5" height="5" rx=".8"/><rect x=".5" y="7.5" width="5" height="5" rx=".8"/><rect x="7.5" y="7.5" width="5" height="5" rx=".8"/></svg>
          <svg class="i-close" width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" aria-hidden="true"><path d="M1 1l9 9M10 1l-9 9"/></svg>
        </button>
        <button class="bar__about" id="js-about-btn" type="button" aria-expanded="false" aria-controls="js-about">About</button>
      </div>
      </div>
      <section class="about" id="js-about" hidden>
        <div class="about__lead">
        <h1 class="about__title">
          <span style="--i:0">40 albums,</span>
          <em style="--i:1">40 days,</em>
          <span style="--i:2">40 years.</span>
        </h1>
        <p class="about__body" style="--i:3">Counting down 40 albums that shaped me, one a day, before I turn 40.</p>
        <div class="about__meta" style="--i:4">
          <p class="about__quiet">In no particular order.</p>
          <p class="about__facts mono">Sep 23 → Nov 1, 2026</p>
        </div>
        </div>
        <div class="about__project" id="js-about-project" style="--i:5" hidden></div>
      </section>
      <section class="index" id="js-index" aria-label="Index" hidden>
        <p class="index__meta mono" style="--i:0"><span>Day 01 → 40</span></p>
        <nav class="grid40" id="js-grid" aria-label="Every day of the countdown" style="--i:1"></nav>
      </section>
    </header>

    <div class="wordmark wordmark--top" aria-hidden="true"><span>404040</span></div>

    <section id="js-feed" class="empty">Loading…</section>

    <footer class="foot mono">
      <ul class="foot__links">
        <li><a href="/">← drewroper.com</a></li>
        <li><a href="https://claude.com/claude-code" target="_blank" rel="noopener">Made with Claude Code ↗</a></li>
        <li>Set in <a href="https://studio2am.co/products/porca-a-rounded-pixel-font" target="_blank" rel="noopener">Porca ↗</a> &amp; <a href="https://vercel.com/font" target="_blank" rel="noopener">Geist ↗</a></li>
        <li class="foot__count" id="js-count" hidden>Visits <span></span></li>
      </ul>
    </footer>
  </main>
  <section class="tail" id="js-tail" aria-hidden="true">
    <div class="tail__stage">
      <canvas class="tail__cv" id="js-tail-cv"></canvas>
      <div class="page tail__col">
        <div class="wordmark tail__cap" id="js-tail-start"><span>404040</span></div>
      </div>
    </div>
    <div class="page tail__bonus" id="js-tail-bonus" hidden></div>
  </section>

  <script>
  (() => {
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    // "Today" in Denver — the countdown runs on the day the story posts,
    // not on wherever the reader's browser happens to be.
    const today = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'America/Denver', year: 'numeric', month: '2-digit', day: '2-digit',
    }).format(new Date());

    // ?preview shows every slotted record regardless of date, so a blurb
    // can be proofed before it goes live. ?test (also /40/test/) swaps in
    // data/albums.test.json — sample entries for looking at the design.
    const params  = new URLSearchParams(location.search);
    const test    = params.has('test');
    const preview = test || params.has('preview');
    const WORN    = !params.has('clean');   // worn sleeves are the default; ?clean shows the original art
    const PREVIEWS = params.get('player') !== 'embed';                        // our own preview player; ?player=embed brings back Apple's
    const PV_ICON = '<svg class="pv__go" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linejoin="round"><path d="M4.5 2.8v10.4L13 8z"/></svg><svg class="pv__pause" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><path d="M5.5 3v10M10.5 3v10"/></svg>';
    const FLIP_ICON = '<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.8-4.1"/><path d="M13.5 2.5v3h-3"/></svg>';
    const DATA    = test ? '../data/albums.test.json' : '../data/albums.json';

    const wv = a => a.worn_v ? `?v=${a.worn_v}` : '';     // sleeve version stamp: a re-baked sleeve is fetched fresh, not from cache
    const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    // Blurbs are plain paragraphs; _underscores_ become italics for titles.
    // Blurb markup: _italic_ and [words](https://link). Escaped first, so only these two come through.
    const inline = s => esc(s)
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`)
      .replace(/(^|[^\w/])_([^_]+)_(?![\w])/g, '$1<em>$2</em>');
    const pad = n => String(n).padStart(2, '0');
    const fmtDate = iso => {
      const [y, m, d] = iso.split('-').map(Number);
      return `${MONTHS[m - 1]} ${d}, ${y}`;
    };
    const fmtMs = ms => {
      const s = Math.round(ms / 1000);
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
      return h ? `${h}:${pad(m)}:${pad(r)}` : `${m}:${pad(r)}`;
    };
    const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);

    const hasPreviews = a => PREVIEWS && (a.tracks || []).some(t => t.preview);
    function previewPlayer(a) {
      return `<div class="pv">
        <div class="pv__head mono"><button class="pv__play" type="button" aria-label="Play previews of ${esc(a.title)}">${PV_ICON}</button><span class="pv__now">Play previews</span><span class="pv__time">0:30 clips</span></div>
        <ol class="pv__list">${a.tracks.map((t, i) => `<li><button class="pv__row" type="button" data-i="${i}"${t.preview ? ` data-src="${esc(t.preview)}"` : ' disabled'}><span class="pv__n mono">${pad(t.n)}</span><span class="pv__t">${esc(t.title)}</span><span class="pv__d mono">${fmtMs(t.ms)}</span></button><i class="pv__bar"></i></li>`).join('')}</ol>
      </div>`;
    }

    function player(a) {
      if (hasPreviews(a)) return previewPlayer(a);
      if (!a.apple_id) {
        return `<p class="entry__noplayer">Not on Apple Music.${a.link ? ` <a href="${esc(a.link)}" target="_blank" rel="noopener">Listen here</a>.` : ''}</p>`;
      }
      const slug = (a.apple_url || '').split('/').slice(-2, -1)[0] || a.slug;
      return `<iframe loading="lazy" title="${esc(a.artist)} — ${esc(a.title)} on Apple Music"
        allow="autoplay *; encrypted-media *; clipboard-write"
        sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation"
        src="https://embed.music.apple.com/us/album/${esc(slug)}/${a.apple_id}?theme=dark"></iframe>`;
    }

    // Listen: Apple Music, Spotify, then album.link to pick any other app. Direct links when the
    // data has them, a search otherwise; on a phone each one opens the app. The first is the accent.
    function listen(a) {
      const q = encodeURIComponent(`${a.artist} ${a.title}`);
      const L = a.links || {}, sp = (L.spotify || '').match(/album\/([A-Za-z0-9]+)/);
      const pick = a.apple_id ? `https://album.link/i/${a.apple_id}` : sp ? `https://album.link/s/${sp[1]}` : '';
      if (a.bonus || a.secret) return pick ? `<div class="listen listen--solo"><a class="listen__any mono" href="${esc(pick)}" target="_blank" rel="noopener">Open in your music app ↗</a></div>` : '';
      const btns = [
        a.apple_id && [a.apple_url || `https://music.apple.com/us/album/${a.apple_id}`, 'Apple Music'],
        [L.spotify || `https://open.spotify.com/search/${q}/albums`, 'Spotify'],
        pick && [pick, 'Pick your app'],
      ].filter(Boolean);
      return `<div class="listen">${btns.map(([u, n], i) =>
        `<a class="${i ? 'listen__svc' : 'listen__any'} mono" href="${esc(u)}" target="_blank" rel="noopener">${n} ↗</a>`).join('')}</div>`;
    }

    function tracks(a) {
      if (!a.tracks || !a.tracks.length || hasPreviews(a)) return '';        // the preview player already lists them
      return `<details>
        <summary class="mono">Tracklist</summary>
        <ol class="tracks">${a.tracks.map(t => `
          <li><span class="tracks__n mono">${pad(t.n)}</span><span class="tracks__t">${esc(t.title)}</span><span class="tracks__d mono">${fmtMs(t.ms)}</span></li>`).join('')}
        </ol>
      </details>`;
    }

    // The back of the record: the real back cover when we found one, else the tracklist set in mono.
    function back(a) {
      if (WORN && a.art_back_worn) return `<img class="is-square" src="../${esc(a.art_back_worn)}${wv(a)}" alt="" loading="lazy" />`;
      if (a.art_back) return `<img src="../${esc(a.art_back)}" alt="" loading="lazy" onload="if (Math.max(this.naturalWidth, this.naturalHeight) / Math.min(this.naturalWidth, this.naturalHeight) < 1.08) this.classList.add('is-square')" />`;
      if (!a.tracks || !a.tracks.length) return '';
      const n = a.tracks.length, size = n > 22 ? ' is-xlong' : n > 14 ? ' is-long' : '';
      return `<ol class="flip__list mono${size}">${a.tracks.map(t =>
        `<li><span>${pad(t.n)}</span>${esc(t.title)}<span>${fmtMs(t.ms)}</span></li>`).join('')}
        <li class="flip__list-foot">${esc([a.year, a.label].filter(Boolean).join(' · '))}</li></ol>`;
    }

    function entry(a) {
      const facts = [a.year, a.label, a.track_count && `${a.track_count} tracks`, a.runtime_ms && fmtMs(a.runtime_ms)]
        .filter(Boolean).map(f => `<span>${esc(f)}</span>`).join('');
      const blurb = a.blurb && a.blurb.length
        ? a.blurb.map(p => `<p>${inline(p)}</p>`).join('')
        : `<p class="entry__blurb--empty">Blurb still cooking.</p>`;
      const head = a.secret
        ? `<span class="entry__no">Secret album</span><span>You found it.</span>`
        : a.bonus
        ? `<span class="entry__no">Bonus album</span><span>A reward for your <button class="egg" id="js-egg" type="button"${EGG ? ' aria-haspopup="dialog"' : ' aria-pressed="false"'}>curiosity</button>.</span>`
        : `<span class="entry__no"><a href="#${pad(a.no)}">Day ${pad(a.no)}</a></span><span>${fmtDate(a.date)}</span>`;
      return `<article class="entry" id="${a.secret ? 'secret' : a.bonus ? 'bonus' : pad(a.no)}">
        <div class="entry__head mono">${head}</div>
        <div class="entry__grid">
          <button class="entry__cover-wrap" type="button" aria-label="Flip ${esc(a.title)} over" aria-pressed="false" style="display:block;width:100%;padding:0;border:0;background:none;text-align:left;">
            <div class="flip">
              ${a.art ? `<img class="entry__cover flip__front" src="../${esc(WORN && a.art_worn ? a.art_worn + wv(a) : a.art)}" alt="${esc(a.title)} cover" loading="lazy" />`
                      : `<div class="entry__cover entry__cover--empty flip__front" aria-label="${esc(a.title)} cover"><span>?</span></div>`}
              <div class="flip__back" aria-hidden="true">${back(a)}</div>
            </div>
            <span class="flip-hint" aria-hidden="true">${FLIP_ICON}</span>
          </button>
          <div class="entry__text">
            <p class="entry__artist">${esc(a.artist)}</p>
            <h2 class="entry__title">${esc(a.title)}</h2>
            <p class="entry__facts mono">${facts}</p>
            ${a.discovered ? `<p class="entry__found"><b>First heard:</b> ${inline(a.discovered)}</p>` : ''}
          </div>
        </div>

      const release = () => {
        if (ty !== null && atEnd && !REDUCED && samples.length > 1) {
          const [t0s, y0] = samples[0], [t1s, y1] = samples[samples.length - 1], dt = t1s - t0s;
          const v = dt > 0 ? (y0 - y1) / dt : 0;                          // px per ms, upward drag positive
          if (v > .3 && performance.now() - t1s < 80) { mom = Math.min(v, 6); momT = performance.now(); if (!momRaf) momRaf = requestAnimationFrame(momentum); }
        }
        ty = null; samples = [];
      };
      addEventListener('touchend', release, { passive: true });
      addEventListener('touchcancel', () => { ty = null; samples = []; }, { passive: true });
      let rw = 0; addEventListener('resize', () => { clearTimeout(rw); rw = setTimeout(() => { build(); kick(); if (REDUCED) draw(performance.now()); }, 150); });
      const start = () => { build(); if (REDUCED) { rise = innerHeight; stuck = innerHeight * .8; runway = innerHeight; draw(performance.now()); } else kick(); };
      if (params.has('debug')) window.__tail = () => ({ rise, stuck, runway, virtual, atEnd, visible, docked });
      (document.fonts && document.fonts.load ? document.fonts.load('400 100px Porca') : Promise.resolve()).then(start, start);
    })();
    // Preview player: one shared <audio>. Play runs through the record from the top (or resumes);
    // a row plays that track; each clip rolls into the next; starting one record stops another.
    if (PREVIEWS) {
      const au = new Audio(); au.preload = 'none';
      let cur = null, idx = -1;
      const rows = pv => [...pv.querySelectorAll('.pv__list li')];
      const paint = () => {
        document.querySelectorAll('.pv').forEach(pv => {
          const mine = pv === cur, live = mine && idx >= 0;
          pv.classList.toggle('is-playing', mine && !au.paused); pv.classList.toggle('is-live', live);
          rows(pv).forEach((li, i) => { const on = live && i === idx; li.classList.toggle('is-on', on); if (!on) li.style.removeProperty('--p'); });
          if (live) { const r = rows(pv)[idx]; pv.querySelector('.pv__now').textContent = r.querySelector('.pv__t').textContent; }
          else pv.querySelector('.pv__now').textContent = 'Play previews';
          if (!live) pv.querySelector('.pv__time').textContent = '0:30 clips';
        });
      };
      const playAt = (pv, i) => {
        const btns = [...pv.querySelectorAll('.pv__row')];
        while (i < btns.length && !btns[i].dataset.src) i++;
        if (i >= btns.length) { au.pause(); cur = null; idx = -1; paint(); return; }
        cur = pv; idx = i; au.src = btns[i].dataset.src; au.currentTime = 0; au.play().catch(() => {}); paint();
      };
      document.addEventListener('click', e => {
        const row = e.target.closest('.pv__row'), btn = e.target.closest('.pv__play');
        if (!row && !btn) return;
        const pv = e.target.closest('.pv');
        if (row) { const i = +row.dataset.i; if (pv === cur && i === idx) { au.paused ? au.play() : au.pause(); } else playAt(pv, i); return; }
        if (pv === cur && idx >= 0) { au.paused ? au.play() : au.pause(); } else playAt(pv, 0);
      });
      au.addEventListener('play', paint); au.addEventListener('pause', paint);
      au.addEventListener('ended', () => cur && playAt(cur, idx + 1));
      au.addEventListener('timeupdate', () => {
        if (!cur || idx < 0 || !au.duration) return;
        const li = rows(cur)[idx]; if (li) li.style.setProperty('--p', (au.currentTime / au.duration).toFixed(4));
        const r = Math.max(0, Math.ceil(au.duration - au.currentTime)); cur.querySelector('.pv__time').textContent = `-0:${pad(r)}`;
      });
    }

    // A flipped sleeve turns back to its front once its whole entry has scrolled out of view,
    // instantly (it's off screen), so every record reads front-first when you come back to it.
    const unflip = wrap => {
      const parts = [wrap.querySelector('.flip'), wrap.querySelector('.flip-hint svg')].filter(Boolean);
      parts.forEach(el => el.style.transition = 'none');
      wrap.classList.remove('is-flipped'); wrap.setAttribute('aria-pressed', 'false');
      void wrap.offsetWidth; parts.forEach(el => el.style.transition = '');
    };
    const offscreen = 'IntersectionObserver' in window ? new IntersectionObserver(list => list.forEach(e => {
      if (e.isIntersecting) return;
      const wrap = e.target.querySelector('.entry__cover-wrap.is-flipped');
      if (wrap) unflip(wrap);
      offscreen.unobserve(e.target);
    })) : null;
    document.addEventListener('click', e => {
      const wrap = e.target.closest('.entry__cover-wrap');
      if (!wrap) return;
      const on = wrap.classList.toggle('is-flipped');
      wrap.setAttribute('aria-pressed', on);
      const entry = wrap.closest('.entry');
      if (on && offscreen && entry) offscreen.observe(entry);
    });

    // ── Birthday mode ────────────────────────────────────────────────────
    const BIRTHDAY = params.has('birthday');                  // by hand only for now; nothing on this page switches on by date
    // ?worn, ?worn=light, ?worn=heavy — each record's own sleeve wear over its cover (a test for now).
    if (WORN) document.body.classList.add('is-worn');
    if (BIRTHDAY) document.body.classList.add('is-birthday');

    // Pixel confetti: rounded squares in the accent, a few tiny 40s, raining
    // the whole time. Tap anywhere for a burst.
    function startConfetti() {
      if (REDUCED) return;
      const cv = document.createElement('canvas'); cv.className = 'confetti'; document.body.appendChild(cv);
      const ctx = cv.getContext('2d');
      const P = [], G = 2;                      // pixel unit
      const size = () => { cv.width = Math.ceil(innerWidth / G); cv.height = Math.ceil(innerHeight / G); cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px'; };
      size(); addEventListener('resize', size);
      const spawn = (x, y, vx, vy) => P.push({ x, y, vx, vy, s: 1 + Math.random() * 1.6, t: Math.random() * 6.28,
        forty: Math.random() < .03, c: Math.random() < .85 ? '#d6ff38' : '#f4f1ec' });
      for (let i = 0; i < 110; i++) spawn(Math.random() * cv.width, Math.random() * cv.height, 0, .4 + Math.random() * .5);
      addEventListener('pointerdown', e => {
        if (e.target.closest('a, button, iframe')) return;
        for (let i = 0; i < 30; i++) { const a = Math.random() * 6.28, v = 2 + Math.random() * 4; spawn(e.clientX / G, e.clientY / G, Math.cos(a) * v, Math.sin(a) * v - 2); }
      });
      ctx.font = '5px Porca, monospace';
      const tick = () => {
        ctx.clearRect(0, 0, cv.width, cv.height);
        for (let i = P.length - 1; i >= 0; i--) {
          const p = P[i]; p.t += .05; p.vy = Math.min(p.vy + .02, 1.6); p.vx *= .98;
          p.x += p.vx + Math.sin(p.t) * .3; p.y += p.vy;
          if (p.y > cv.height + 4) { if (P.length > 110) { P.splice(i, 1); continue; } p.y = -4; p.x = Math.random() * cv.width; p.vy = .4 + Math.random() * .5; p.vx = 0; }
          ctx.fillStyle = p.c;
          if (p.forty) ctx.fillText('40', Math.round(p.x), Math.round(p.y));
          else { const x = Math.round(p.x), y = Math.round(p.y), s = Math.max(1, Math.round(p.s)); if (s > 2) { ctx.fillRect(x + 1, y, s - 2, s); ctx.fillRect(x, y + 1, s, s - 2); } else ctx.fillRect(x, y, s, s); }
        }
        requestAnimationFrame(tick);
      };
      tick();
    }

    // Happy Birthday in square waves, on a tap of the big wordmark.
    function chiptune(el) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const ac = chiptune.ac || (chiptune.ac = new AC()); ac.resume();
      const N = { G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99 };
      const tune = [['G4',.75],['G4',.25],['A4',1],['G4',1],['C5',1],['B4',2],
                    ['G4',.75],['G4',.25],['A4',1],['G4',1],['D5',1],['C5',2],
                    ['G4',.75],['G4',.25],['G5',1],['E5',1],['C5',1],['B4',1],['A4',2],
                    ['F5',.75],['F5',.25],['E5',1],['C5',1],['D5',1],['C5',2]];
      const beat = .42; let t = ac.currentTime + .05;
      el.classList.add('is-playing');
      for (const [n, d] of tune) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'square'; o.frequency.value = N[n];
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.08, t + .01); g.gain.setValueAtTime(.08, t + d * beat - .06); g.gain.linearRampToValueAtTime(0, t + d * beat - .01);
        o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d * beat); t += d * beat;
      }
      setTimeout(() => el.classList.remove('is-playing'), (t - ac.currentTime) * 1000);
    }

    if (BIRTHDAY) {
      startConfetti();
      document.querySelectorAll('.wordmark').forEach(w => { w.setAttribute('role', 'button'); w.removeAttribute('aria-hidden'); w.setAttribute('aria-label', 'Play Happy Birthday'); w.tabIndex = 0;
        w.addEventListener('click', () => chiptune(w)); w.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') chiptune(w); }); });
    }

    // The 40th cell arrives with a dither pulse on the day, instead of just being there.
    function arrive(cell) {
      const img = cell.querySelector('img');
      const go = () => {
        cell.classList.add('is-arriving');
        const cv = document.createElement('canvas'); cell.appendChild(cv);
        const r = cell.getBoundingClientRect(); cv.width = cv.height = Math.round(r.width * devicePixelRatio);
        const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
        const small = document.createElement('canvas'), sctx = small.getContext('2d', { willReadFrequently: true });
        const steps = [0, 8, 16, 32, 64]; let i = 0;
        const frame = () => {
          const g = steps[i];
          ctx.clearRect(0, 0, cv.width, cv.height);
          if (g === 0) { ctx.fillStyle = '#0c0c0d'; ctx.fillRect(0, 0, cv.width, cv.height); }
          else {
            small.width = small.height = g; sctx.drawImage(img, 0, 0, g, g);
            let px; try { px = sctx.getImageData(0, 0, g, g).data; } catch (e) { cv.remove(); return; }
            const out = sctx.createImageData(g, g);
            for (let y = 0; y < g; y++) for (let x = 0; x < g; x++) { const k = (y * g + x) * 4;
              const l = ((0.299 * px[k] + 0.587 * px[k + 1] + 0.114 * px[k + 2]) - 128) * 1.2 + 128, on = l > BAYER[(y & 7) * 8 + (x & 7)];
              out.data[k] = on ? 244 : 12; out.data[k + 1] = on ? 241 : 12; out.data[k + 2] = on ? 236 : 13; out.data[k + 3] = 255; }
            sctx.putImageData(out, 0, 0); ctx.drawImage(small, 0, 0, cv.width, cv.height);
          }
          i++; if (i < steps.length) setTimeout(frame, 160); else setTimeout(() => { cv.remove(); cell.classList.remove('is-arriving'); }, 160);
        };
        frame();
      };
      if (img.complete && img.naturalWidth) go(); else img.addEventListener('load', go, { once: true });
    }

    // Reloads: the page is empty until the data lands, so the browser's own scroll restore
    // lands on the footer. Keep the spot ourselves and put it back once the feed is in;
    // the footer stays hidden until then.
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    addEventListener('pagehide', () => { try { sessionStorage.setItem('40:y', String(scrollY)); } catch (e) {} });
    const navType = (performance.getEntriesByType && (performance.getEntriesByType('navigation')[0] || {}).type) || '';
    const ready = () => {
      let y = 0;
      try { if (navType === 'reload') y = parseFloat(sessionStorage.getItem('40:y')) || 0; } catch (e) {}
      if (y > 0) scrollTo({ top: y, behavior: 'instant' });
      else if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }
      document.documentElement.classList.add('is-ready');
    };

    // The small 404040 in the bar: back to the top, and drop the #day so a refresh stays there.
    document.getElementById('js-top').addEventListener('click', e => {
      e.preventDefault();
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
      scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
    });

    // Visitor counter in the colophon, old-web style: one hit per browser session (refreshes don't
    // count, nor do ?preview / ?test), shown zero-padded. Abacus is a free, cookieless counter; if it's
    // down the line just stays hidden.
    (function visits() {
      const el = document.getElementById('js-count'); if (!el || !window.fetch) return;
      let seen = false; try { seen = sessionStorage.getItem('40:counted') === '1'; } catch (e) {}
      const verb = preview || seen ? 'get' : 'hit';
      fetch(`https://abacus.jasoncameron.dev/${verb}/drewroper.com/40-visits`)
        .then(r => r.ok ? r.json() : Promise.reject(r.status))
        .then(({ value }) => {
          if (!Number.isFinite(value)) return;
          if (verb === 'hit') try { sessionStorage.setItem('40:counted', '1'); } catch (e) {}
          el.lastElementChild.textContent = String(value).padStart(6, '0'); el.hidden = false;
        })
        .catch(() => {});
    })();

    // ── The secret album. Armed only when a record flagged `secret` is out (live by hand, or ?preview);
    //    until then "curiosity" just flips the page negative, and back.
    let EGG = null;
    function setupEgg(rec) {
      const egg = document.getElementById('js-egg'), bonus = document.getElementById('bonus');
      if (!egg) return;
      const root = document.documentElement;
      if (!rec) {
        const neg = on => root.classList.toggle('is-negative', on), later = (ms, fn) => setTimeout(fn, ms);
        let on = false;
        egg.addEventListener('click', e => {
          e.stopPropagation(); on = !on; egg.setAttribute('aria-pressed', String(on));
          if (REDUCED) return neg(on);
          root.classList.add('is-rattling'); later(520, () => root.classList.remove('is-rattling'));
          neg(on); later(90, () => neg(!on)); later(170, () => neg(on)); later(300, () => neg(!on)); later(380, () => neg(on));
        });
        return hint();
      }
      const box = document.createElement('div');
      box.className = 'secret'; box.id = 'js-secret'; box.hidden = true;
      box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-label', 'Secret album');
      box.innerHTML = `<div class="secret__panel"><button class="secret__close" type="button">Close</button>${entry(rec)}</div>`;
      document.body.appendChild(box);
      box.querySelectorAll('img').forEach(i => { i.loading = 'eager'; });   // ready before anyone finds it
      const panel = box.firstElementChild;
      const later = (ms, fn) => setTimeout(fn, ms);
      const neg = on => root.classList.toggle('is-negative', on);
      // The panel dithers in through the same Bayer dots as the masthead, square to the page.
      const ditherPanel = (dir, done) => {
        const B = BAYER8, cell = 4, steps = 7, tile = document.createElement('canvas'); tile.width = tile.height = 8 * cell;
        const tc = tile.getContext('2d');
        let k = 0;
        const frame = () => {
          const lvl = dir > 0 ? k / steps : 1 - k / steps;
          tc.clearRect(0, 0, 8 * cell, 8 * cell); tc.fillStyle = '#000';
          for (let i = 0; i < 64; i++) if (B[i] < lvl * 64) tc.fillRect((i & 7) * cell, (i >> 3) * cell, cell, cell);
          const u = lvl >= 1 ? '' : `url(${tile.toDataURL()})`;
          panel.style.maskImage = panel.style.webkitMaskImage = u;
          panel.style.maskSize = panel.style.webkitMaskSize = u ? `${8 * cell}px ${8 * cell}px` : '';
          if (k++ < steps) later(34, frame); else done && done();
        };
        frame();
      };
      let opener = null;
      const open = () => {
        if (!box.hidden) return;
        opener = document.activeElement;
        document.body.style.overflow = 'hidden';
        if (REDUCED) { neg(true); box.hidden = false; box.querySelector('.secret__close').focus(); return; }
        // Two hard flips of the negative (well under three flashes a second), a rattle, then the record.
        root.classList.add('is-rattling');
        neg(true); later(90, () => neg(false)); later(170, () => neg(true)); later(300, () => neg(false)); later(380, () => neg(true));
        later(520, () => root.classList.remove('is-rattling'));
        later(400, () => {
          box.hidden = false;
          ditherPanel(1, () => box.querySelector('.secret__close').focus({ preventScroll: true }));
        });
      };
      const close = () => {
        if (box.hidden) return;
        const end = () => { box.hidden = true; neg(false); document.body.style.overflow = ''; panel.style.maskImage = panel.style.webkitMaskImage = '';
                            const pl = box.querySelector('.pv.is-playing .pv__play'); if (pl) pl.click();   // stop its preview on the way out
                            if (opener && opener.focus) opener.focus({ preventScroll: true }); };
        if (REDUCED) return end();
        ditherPanel(-1, () => { neg(false); later(80, () => neg(true)); later(160, end); });
      };
      egg.addEventListener('click', e => { e.stopPropagation(); open(); });
      box.querySelector('.secret__close').addEventListener('click', close);
      box.addEventListener('click', e => { if (e.target === box) close(); });
      addEventListener('keydown', e => { if (e.key === 'Escape' && !box.hidden) close(); });

      hint();

      // The hint: ten seconds on the bonus, then one lime sweep across the word, once a minute.
      function hint() {
      if (REDUCED || !bonus || !('IntersectionObserver' in window)) return;
      let first = 0, every = 0;
      const shimmer = () => { egg.classList.remove('is-shimmer'); void egg.offsetWidth; egg.classList.add('is-shimmer'); };
      egg.addEventListener('animationend', () => egg.classList.remove('is-shimmer'));
      new IntersectionObserver(([en]) => {
        clearTimeout(first); clearInterval(every);
        if (en.isIntersecting) first = setTimeout(() => { shimmer(); every = setInterval(shimmer, 60000); }, 10000);
      }, { threshold: .4 }).observe(bonus);
      }
    }

    fetch(DATA + '?v=' + Date.now())
      .then(r => r.json())
      .then(({ meta, albums }) => {
        const slotted = albums.filter(a => a.no && a.date && !a.bonus).sort((x, y) => x.no - y.no);
        const isOut   = a => preview || a.live === true;                 // a record is out only when marked live by hand; dates never publish anything
        const live    = slotted.filter(isOut);

        // About panel: collapsed by default, since most visits are repeat
        // visits from a story. Opens itself only when there's nothing else
        // on the page yet.
        const proj = document.getElementById('js-about-project'), projText = [].concat(meta.about || []);
        if (proj && projText.length) { proj.innerHTML = projText.map(p => `<p>${inline(p)}</p>`).join(''); proj.hidden = false; }

        // Two dropdowns hang off the bar, About and Index; one open at a time.
        const about = document.getElementById('js-about'), btn = document.getElementById('js-about-btn');
        const index = document.getElementById('js-index'), ibtn = document.getElementById('js-index-btn');
        let open = null;
        const setPanel = name => {
          open = name;
          about.hidden = name !== 'about'; btn.setAttribute('aria-expanded', String(name === 'about'));
          index.hidden = name !== 'index'; ibtn.setAttribute('aria-expanded', String(name === 'index'));
          btn.textContent = name === 'about' ? 'Close' : 'About';
          document.body.style.overflow = name ? 'hidden' : '';
        };
        btn.addEventListener('click', e => { e.stopPropagation(); setPanel(open === 'about' ? null : 'about'); });
        ibtn.addEventListener('click', e => { e.stopPropagation(); setPanel(open === 'index' ? null : 'index'); });

        // The small 404040 in the bar appears only once the big one is gone.
        const bar = document.querySelector('.bar');
        const big = document.querySelector('.wordmark--top');
        if (big && 'IntersectionObserver' in window) {
          new IntersectionObserver(([e]) => {
            bar.classList.toggle('is-scrolled', !e.isIntersecting && e.boundingClientRect.top < 0);
          }, { threshold: 0, rootMargin: '-48px 0px 0px 0px' }).observe(big);
        } else if (bar) {
          bar.classList.add('is-scrolled');
        }
        about.addEventListener('click', e => e.stopPropagation());
        index.addEventListener('click', e => { e.stopPropagation(); if (e.target.closest('.grid40 a')) setPanel(null); });
        document.addEventListener('click', () => { if (open) setPanel(null); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && open) setPanel(null); });


        const byNo = new Map(slotted.map(a => [a.no, a]));
        document.getElementById('js-grid').innerHTML = Array.from({ length: meta.total }, (_, i) => {
          const a = byNo.get(i + 1);
          if (a && isOut(a)) return `<a href="#${pad(a.no)}" title="Day ${pad(a.no)} · ${esc(a.artist)} — ${esc(a.title)}"><img src="../${esc((WORN && a.art_worn) ? a.art_worn + wv(a) : a.art || '')}" alt="" loading="lazy"></a>`;
          return `<span aria-hidden="true">${pad(i + 1)}</span>`;
        }).join('');
        const last = document.querySelector('#js-grid a:nth-child(40)');
        if (BIRTHDAY && last && !REDUCED && 'IntersectionObserver' in window) {
          new IntersectionObserver((es, io) => { if (es[0].isIntersecting) { io.disconnect(); setTimeout(() => arrive(last), 500); } }, { threshold: .6 }).observe(last);
        }

        // The bonus record lives in the albums list flagged `bonus`, outside the countdown and the grid.
        const bonusEl = document.getElementById('js-tail-bonus'), bonusRec = albums.find(a => a.bonus);
        EGG = albums.find(a => a.secret && isOut(a)) || null;
        if (bonusEl && bonusRec) bonusEl.innerHTML = entry(Object.assign({ no: 0 }, bonusRec));
        setupEgg(EGG);   // no secret out yet: the word still flips the page

        const feed = document.getElementById('js-feed');
        if (!live.length) {
          const n = daysBetween(today, meta.start);
          feed.innerHTML = `<b>Day 01 drops ${fmtDate(meta.start)}.</b>` +
            (n > 0 ? ` ${n} day${n === 1 ? '' : 's'} out.` : '');
          ready();
          return;
        }
        feed.className = '';
        // Newest on top, like a blog.
        feed.innerHTML = live.slice().reverse().map(entry).join('');
        ready();
      })
      .catch(err => {
        document.getElementById('js-feed').textContent = 'Could not load albums.json — ' + err.message;
        ready();
      });
  })();
  </script>
</body>
</html>
