<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>log — drewroper</title>
  <link rel="icon" type="image/svg+xml" href="assets/dr-logo.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:         #0c0c0d;
      --text:       #f4f1ec;
      --text-muted: #8c8a86;
      --text-faint: #56544f;
      --accent:     #d6ff38;
      --mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { background: var(--bg); }
    body {
      background: var(--bg);
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    ::selection { background: var(--accent); color: var(--bg); }

    .log {
      /* 20px on top, left, right; generous padding-bottom so the end
         of the feed has breathing room once you scroll to it. */
      padding: 20px 20px 80px;
      overflow-wrap: break-word;
      hyphens: auto;
    }

    .meta {
      color: var(--text-faint);
      margin-bottom: 18px;
    }
    .meta a {
      color: var(--text-faint);
      text-decoration: none;
      border-bottom: 1px solid var(--text-faint);
    }
    .meta a:hover { color: var(--accent); border-bottom-color: var(--accent); }
    .meta__glyph { color: var(--accent); }

    /* Year pills are inserted inline into the stream of entries —
       they mark the moment a new year begins without breaking the
       chain. display: inline (not inline-block) lets the pill flow
       in the prose like a styled word, so it never gets orphaned to
       its own line. */
    .year__pill {
      padding: 0 9px;
      background: var(--accent);
      color: var(--bg);
      font-weight: 500;
      border-radius: 999px;
      letter-spacing: .02em;
      /* Horizontal box-decoration so the rounded corners survive
         a wrap mid-pill (rare, but possible on a long year string). */
      -webkit-box-decoration-break: clone;
              box-decoration-break: clone;
    }

    /* Each entry is inline; the wall of text flows naturally. */
    .entry a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color .15s ease, border-color .15s ease;
    }
    .entry a:hover {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .entry__tag    { color: var(--text-faint); }
    .entry__glyph  { color: var(--accent); }
    .entry__year   { color: var(--text-faint); }
    .entry__rating { color: var(--text); }
    .entry__date   { color: var(--text-faint); }
    .sep           { color: var(--text-faint); }

    .empty { color: var(--text-faint); }
  </style>
</head>
<body>
  <main class="log" id="js-log">
    <div class="meta">
      <a href="/">← drewroper.com</a>
      &nbsp;·&nbsp; <span id="js-count">…</span> entries
      &nbsp;·&nbsp; <span class="meta__glyph">⌗</span> letterboxd
      &nbsp;·&nbsp; <span class="meta__glyph">◉</span> discogs
    </div>
    <div id="js-feed" class="empty">Loading…</div>
  </main>

  <script src="log.js?v=1"></script>
</body>
</html>
